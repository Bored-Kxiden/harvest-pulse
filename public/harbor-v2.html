/** Dusk. The same painting, lit later: a cool multiply over everything, a warm
    band left on the horizon where the sun just went, and a few stars once it is
    properly dark. Repainting five night palettes would say less and cost more. */
function paintDusk(ctx, view, amount, t) {
    if (amount < 0.01)
        return;
    const { w, h } = view;
    const horizon = h * HORIZON;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const cool = ctx.createLinearGradient(0, 0, 0, h);
    cool.addColorStop(0, `rgba(58,74,104,${(0.82 * amount).toFixed(3)})`);
    cool.addColorStop(0.3, `rgba(74,86,102,${(0.7 * amount).toFixed(3)})`);
    cool.addColorStop(1, `rgba(40,56,50,${(0.86 * amount).toFixed(3)})`);
    ctx.fillStyle = cool;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    const warm = ctx.createLinearGradient(0, horizon - 90, 0, horizon + 26);
    warm.addColorStop(0, 'rgba(0,0,0,0)');
    warm.addColorStop(0.7, `rgba(214,132,74,${(0.16 * amount).toFixed(3)})`);
    warm.addColorStop(1, `rgba(240,178,104,${(0.1 * amount).toFixed(3)})`);
    ctx.fillStyle = warm;
    ctx.fillRect(0, horizon - 90, w, 116);
    /* Stars only once it is dark enough to have any. */
    if (amount > 0.5) {
        ctx.fillStyle = '#FFFDF2';
        for (let i = 0; i < 26; i++) {
            const x = hash(i, 6100) * w;
            const y = hash(i, 6200) * horizon * 0.82;
            const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(t * 0.0004 + i * 1.7));
            ctx.globalAlpha = (amount - 0.5) * 2 * twinkle * 0.75;
            ctx.beginPath();
            ctx.arc(x, y, 0.7 + hash(i, 6300) * 0.9, 0, 6.283185);
            ctx.fill();
        }
    }
    ctx.restore();
}

  petals += '<ellipse cx="0" cy="-26" rx="10" ry="13" fill="' + (i % 2 ? f.petal : f.petalDeep) + '" transform="rotate(' + ((i / f.petals) * 360).toFixed(1) + ')"/>'
 }
 return '<svg width="' + size + '" height="' + Math.round(size * 1.45) + '" viewBox="-46 -118 92 132" aria-hidden="true">' +
  '<path d="M0 0 C -6 -26, 5 -46, 0 -64" fill="none" stroke="#5F9457" stroke-width="5" stroke-linecap="round"/>' +
  '<path d="M0 -28 C -20 -38, -27 -23, -7 -17 Z" fill="#79BC7F"/>' +
  '<path d="M0 -44 C 19 -54, 25 -39, 6 -34 Z" fill="#8ACB8E"/>' +
  '<g transform="translate(0,-68)">' + petals + '<circle r="' + (f.petals > 10 ? 9 : 8) + '" fill="' + f.heart + '"/></g></svg>'
}
const SPRIG = {
 tulip: '<svg class="person-sprig" viewBox="0 0 64 78" fill="none" aria-hidden="true"><path d="M32 76V38" stroke="#6FA765" stroke-width="2.8" stroke-linecap="round"/><path d="M31 54c-3-10-11-15-22-16 1 12 9 19 22 16z" fill="#9CCB8F"/><path d="M33 48c2-9 9-14 20-15-1 11-8 18-20 15z" fill="#7FB878"/><path d="M32 10c7 0 13 6 13 14 0 9-6 15-13 15s-13-6-13-15c0-8 6-14 13-14z" fill="#F7CE63"/><path d="M32 10c-4 4-6 9-6 15s2 11 6 14c4-3 6-8 6-14s-2-11-6-15z" fill="#F2B441"/></svg>',
 leaf: '<svg class="person-sprig" viewBox="0 0 64 78" fill="none" aria-hidden="true"><path d="M30 76V34" stroke="#6FA765" stroke-width="2.6" stroke-linecap="round"/><path d="M29 44c-3-10-11-15-23-16 1 13 9 20 23 16z" fill="#9CCB8F"/><path d="M31 36c2-11 10-17 23-18-1 14-9 22-23 18z" fill="#7FB878"/></svg>',
 cosmos: '<svg class="person-sprig" viewBox="0 0 64 78" fill="none" aria-hidden="true"><path d="M32 76V32" stroke="#6FA765" stroke-width="2.6" stroke-linecap="round"/><path d="M31 52c-3-9-10-13-20-14 1 11 8 17 20 14z" fill="#9CCB8F"/>' + [0, 51, 102, 153, 204, 255, 306].map(a => '<ellipse cx="32" cy="18" rx="6.4" ry="11" fill="' + (a % 102 ? '#F7C3D8' : '#E9A0BF') + '" transform="rotate(' + a + ' 32 30)"/>').join('') + '<circle cx="32" cy="30" r="5.4" fill="#F7C948"/></svg>',
 bell: '<svg class="person-sprig" viewBox="0 0 64 78" fill="none" aria-hidden="true"><path d="M34 76c-2-24-4-40-4-54" stroke="#6FA765" stroke-width="2.6" stroke-linecap="round"/><path d="M32 56c-3-8-9-12-19-13 1 10 7 16 19 13z" fill="#9CCB8F"/><path d="M30 22c-6 0-9 5-9 9s4 7 9 7 9-3 9-7-3-9-9-9z" fill="#88A6DA"/><path d="M40 34c-6 0-9 5-9 9s4 7 9 7 9-3 9-7-3-9-9-9z" fill="#A9C4EC"/></svg>',
}
const SPRIGS = ['tulip', 'leaf', 'cosmos', 'bell']

/* ============================ the meadow ============================ */
/* Pull back and the lens lies down into a plan of who grows where; push in and it
   stands up into country you walk through, bumps and all. One projection the whole
   way, so the change reads as the ground tipping rather than two pictures swapped. */
const holder = $('meadow'), canvas = $('field'), ctx = canvas.getContext('2d')
const REST_REL = 9.5, TAGS_FADE = 14
const TONE_INK = { gold: '#E0AE39', green: '#4E9A5E', orange: '#D9813F', sky: '#5B8FC9' }
const WEATHER_IDS = ['clear', 'bright', 'cloudy', 'rain', 'storm']

let view = { w: 0, h: 0, band: 0, base: 0.2 }
let dpr = 1, started = false, signature = ''
let cam = { x: FIELD_W * 0.5, y: FIELD_H * 0.62, zoom: 0.2 }
let goal = Object.assign({}, cam)
const cells = buildCells()
let plots = [], blossoms = [], plotTints = []
let hits = [], tagHits = []
let wheel = 0, wheelGoal = 0, wheelIndex = 0, wheelSet = false
let tagFade = 1, duskFade = 0
let ink = { face: '#FEFCF5', text: '#13492C' }
const pt = { x: 0, y: 0, s: 1 }

function readInk() {
 const cs = getComputedStyle(canvas)
 const face = cs.getPropertyValue('--tag-face').trim()
 const text = cs.getPropertyValue('--tag-ink').trim()
 if (face) ink = { face, text: text || ink.text }
}

/* ---------- who grows where ---------- */
function lay() {
 const sig = PEOPLE.map(p => p.id).join(',') + '|' + CALLS.length
 if (sig === signature) return
 signature = sig
 plots = buildPlots(PEOPLE.map(p => p.id))
 assignPlots(cells, plots)
 plotTints = plots.map(plot => TONE_INK[(person(plot.id) || {}).tone] || null)
 blossoms = []
 plots.forEach((plot, pi) => {
  const mine = callsFor(plot.id).slice().sort((a, b) => a.at.localeCompare(b.at))
  mine.forEach((call, i) => {
   const r1 = hash2(i, 1, 9100 + pi * 211), r2 = hash2(i, 2, 9100 + pi * 211)
   const reach = plot.radius * 0.74 * Math.sqrt((i + 0.7) / Math.max(mine.length, 7))
   const angle = i * 2.399963 + r1 * 0.6
   const x = plot.x + Math.cos(angle) * reach + (r1 - 0.5) * 14
   const y = plot.y + Math.sin(angle) * reach + (r2 - 0.5) * 14
   blossoms.push({
    call, person: plot.id, x, y, z: heightAt(x, y), kind: call.flower,
    size: Math.min(1.5, Math.max(0.72, 0.6 + Math.sqrt(call.minutes) / 7)),
    spin: r2 * 6.283,
   })
  })
 })
 blossoms.sort((a, b) => a.y - b.y)
}

/** The camera cannot leave the field, and the further back it goes the more it is
    pulled to the middle, so the plan always arrives centred. */
function hold(c) {
 c.zoom = clampZoom(c.zoom, view.base)
 const rel = c.zoom / view.base
 const home = Math.max(0, Math.min(1, (3.4 - rel) / 2.2))
 c.x = Math.min(FIELD_W - 90, Math.max(90, c.x)) * (1 - home) + FIELD_W * 0.44 * home
 c.y = Math.min(FIELD_H - 90, Math.max(90, c.y)) * (1 - home) + FIELD_H * 0.46 * home
}

function dominantOf(id) {
 const tally = {}
 for (const b of blossoms) if (b.person === id) tally[b.kind] = (tally[b.kind] || 0) + 1
 let top = 'daisy', best = 0
 for (const k in tally) if (tally[k] > best) { best = tally[k]; top = k }
 return top
}

new ResizeObserver(entries => {
 const rect = entries[0].contentRect
 if (!rect.width || !rect.height) return
 dpr = Math.min(window.devicePixelRatio || 1, 2)
 const band = rect.height * 0.54
 view = { w: rect.width, h: rect.height, band: band, base: overviewZoom(rect.width, band) }
 canvas.width = Math.round(rect.width * dpr)
 canvas.height = Math.round(rect.height * dpr)
 if (!started) {
  started = true
  lay(); readInk()
  const home = plots[0] || { x: FIELD_W * 0.5, y: FIELD_H * 0.5 }
  cam.x = goal.x = home.x
  cam.y = goal.y = home.y + 170
  cam.zoom = goal.zoom = view.base * REST_REL
 } else { hold(cam); hold(goal) }
}).observe(holder)

new MutationObserver(readInk).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readInk)

function render(now) {
 requestAnimationFrame(render)
 const w = view.w, h = view.h
 if (!w || !h) return
 lay()
 const sky = S.weather
 const reduced = !!S.reduced
 const t = reduced ? 4000 : now
 const ease = reduced ? 1 : 0.11
 cam.x += (goal.x - cam.x) * ease
 cam.y += (goal.y - cam.y) * ease
 cam.zoom += (goal.zoom - cam.zoom) * ease
 const lens = buildLens(cam, view)
 const tilt = lens.tilt

 /* The wheel turns the short way round, the way a dial would. */
 const index = Math.max(0, WEATHER_IDS.indexOf(sky))
 if (!wheelSet) { wheelIndex = index; wheel = wheelGoal = wheelAngleFor(index); wheelSet = true }
 else if (index !== wheelIndex) {
  let step = index - wheelIndex
  if (step > 2) step -= 5
  if (step < -2) step += 5
  wheelGoal -= step * WHEEL_STEP
  wheelIndex = index
 }
 wheel += (wheelGoal - wheel) * (reduced ? 1 : 0.05)

 ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
 ctx.clearRect(0, 0, w, h)

 paintSky(ctx, view, sky, tilt)
 paintWheel(ctx, view, wheel, t, tilt)
 paintClouds(ctx, view, sky, t, tilt)
 paintPlane(ctx, view, sky, tilt)
 paintDistance(ctx, view, sky, tilt, cam.x)
 paintHaze(ctx, view, sky, tilt)

 ctx.save()
 ctx.translate(0, -S.lift * 34)
 paintPlots(ctx, lens, plots, id => plotTints[plots.findIndex(q => q.id === id)] || '#7BAE60', 1 - tilt)
 paintGround(ctx, lens, cells, sky, t)

 const strength = windStrength[sky]
 hits = []
 for (const b of blossoms) {
  project(lens, b.x, b.y, b.z, pt)
  if (pt.x < -60 || pt.x > w + 60 || pt.y < -60 || pt.y > h + 60) continue
  const size = b.size * 7.4 * pt.s
  if (size < 0.7 || pt.y > view.band + 70) continue
  paintBloom(ctx, pt.x, pt.y, size, b.kind, b.spin, windAt(b.x, b.y, t, strength), 1)
  if (size > 2.4) hits.push({ x: pt.x, y: pt.y - size * 2.2, r: Math.max(16, size), call: b.call })
 }
 ctx.restore()

 /* ---------- who lives here ---------- */
 tagFade += ((S.camera ? 0 : 1) - tagFade) * 0.14
 const rel = cam.zoom / view.base
 const alpha = tagFade * (rel > TAGS_FADE ? Math.max(0, 1 - (rel - TAGS_FADE) / 6) : 1)
 tagHits = []
 if (alpha > 0.02) {
  ctx.save()
  ctx.globalAlpha = alpha
  ctx.font = "700 12px var(--round), ui-rounded, sans-serif"
  const laid = []
  for (const plot of plots) {
   const who = person(plot.id)
   if (!who) continue
   let count = 0
   for (const b of blossoms) if (b.person === plot.id) count++
   if (!count) continue
   project(lens, plot.x, plot.y, heightAt(plot.x, plot.y), pt)
   const label = who.name + ' · ' + count
   const wide = ctx.measureText(label).width + 34
   const sx = Math.min(w - wide / 2 - 12, Math.max(wide / 2 + 12, pt.x))
   let sy = Math.min(view.band - 96, Math.max(30, pt.y - 40 - S.lift * 34))
   for (const q of laid) if (Math.abs(q.x - sx) < wide * 0.72 && Math.abs(q.y - sy) < 30) sy = q.y - 32
   if (sy < 26) continue
   laid.push({ x: sx, y: sy })

   ctx.fillStyle = ink.face
   ctx.beginPath(); ctx.roundRect(sx - wide / 2, sy - 13, wide, 26, 13); ctx.fill()
   ctx.beginPath()
   ctx.moveTo(sx - 5, sy + 13); ctx.lineTo(sx + 5, sy + 13); ctx.lineTo(sx, sy + 19)
   ctx.closePath(); ctx.fill()
   paintBloom(ctx, sx - wide / 2 + 15, sy + 6, 7, dominantOf(plot.id), 0.4, 0, 1)
   ctx.fillStyle = ink.text
   ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
   ctx.fillText(label, sx + 7, sy)
   ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic'
   tagHits.push({ x: sx - wide / 2, y: sy - 13, w: wide, h: 26, id: plot.id })
  }
  ctx.restore()
 }

 paintShadows(ctx, view, sky, t, tilt)
 duskFade += ((S.night ? 1 : 0) - duskFade) * (reduced ? 1 : 0.08)
 paintDusk(ctx, view, duskFade, t)
 paintWeather(ctx, view, sky, t, tilt)
}
requestAnimationFrame(render)

/* ---------- push it around ---------- */
const camPointers = new Map()
let camDrag = null, camPinch = null, lastTap = 0
const camLocal = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top } }

canvas.addEventListener('pointerdown', e => {
 canvas.setPointerCapture(e.pointerId)
 const p = camLocal(e)
 camPointers.set(e.pointerId, p)
 if (camPointers.size === 2) {
  const [a, b] = [...camPointers.values()]
  camPinch = { gap: Math.hypot(a.x - b.x, a.y - b.y), zoom: goal.zoom }
  camDrag = null
 } else camDrag = { x: p.x, y: p.y, moved: 0 }
})
canvas.addEventListener('pointermove', e => {
 if (!camPointers.has(e.pointerId)) return
 const p = camLocal(e)
 camPointers.set(e.pointerId, p)
 if (camPinch && camPointers.size === 2) {
  const [a, b] = [...camPointers.values()]
  goal.zoom = camPinch.zoom * (Math.hypot(a.x - b.x, a.y - b.y) / Math.max(camPinch.gap, 1))
  hold(goal)
  return
 }
 if (!camDrag) return
 const dx = p.x - camDrag.x, dy = p.y - camDrag.y
 camDrag.moved += Math.hypot(dx, dy); camDrag.x = p.x; camDrag.y = p.y
 /* Standing up, a finger travels much further into the field than across it. */
 goal.x -= dx / goal.zoom
 goal.y -= (dy / goal.zoom) * (1 + tiltFor(goal.zoom, view.base) * 2.2)
 hold(goal)
})
function camEnd(e) {
 const p = camPointers.get(e.pointerId), begun = camDrag
 camPointers.delete(e.pointerId)
 if (camPointers.size < 2) camPinch = null
 camDrag = null
 if (!begun || !p || begun.moved >= 6) return

 for (const tag of tagHits) {
  if (p.x >= tag.x && p.x <= tag.x + tag.w && p.y >= tag.y && p.y <= tag.y + tag.h) { toast('Conversations live in the full app.'); return }
 }
 let found = null, best = Infinity
 for (const hit of hits) {
  const d = Math.hypot(hit.x - p.x, hit.y - p.y)
  if (d < hit.r * 1.4 && d < best) { best = d; found = hit.call }
 }
 if (found) { openCase(found); return }

 const now = performance.now()
 if (now - lastTap < 320) {
  const rel = goal.zoom / view.base
  const world = unproject(buildLens(cam, view), p.x, p.y)
  goal.x = world.x; goal.y = world.y
  goal.zoom = view.base * (rel > MAX_REL * 0.45 ? 1 : rel < 3.2 ? REST_REL : MAX_REL * 0.62)
  hold(goal)
  lastTap = 0
 } else lastTap = now
}
canvas.addEventListener('pointerup', camEnd)
canvas.addEventListener('pointercancel', camEnd)
canvas.addEventListener('wheel', e => {
 e.preventDefault()
 goal.zoom = clampZoom(goal.zoom * (e.deltaY < 0 ? 1.13 : 1 / 1.13), view.base)
 hold(goal)
}, { passive: false })

/* Everything the meadow offers by drag and pinch it also offers by key. */
canvas.addEventListener('keydown', e => {
 const stride = 120 / Math.max(goal.zoom, 0.2)
 if (e.key === 'ArrowLeft') goal.x -= stride
 else if (e.key === 'ArrowRight') goal.x += stride
 else if (e.key === 'ArrowUp') goal.y -= stride * (1 + tiltFor(goal.zoom, view.base) * 2.2)
 else if (e.key === 'ArrowDown') goal.y += stride * (1 + tiltFor(goal.zoom, view.base) * 2.2)
 else if (e.key === '+' || e.key === '=') goal.zoom *= 1.3
 else if (e.key === '-' || e.key === '_') goal.zoom /= 1.3
 else if (e.key === 'Home') goal.zoom = view.base
 else if (e.key === 'End') goal.zoom = view.base * REST_REL
 else return
 e.preventDefault()
 hold(goal)
})

/** Screen back to world. Exact in the plan; close enough under the tilt that a
    double tap lands where you meant, which is all it is asked for. */
function unproject(lens, sx, sy) {
 const c = lens.cam, v = lens.view
 if (lens.tilt <= 0.02) return { x: c.x + (sx - v.w / 2) / c.zoom, y: c.y + (sy - v.band / 2) / c.zoom }
 const below = Math.max(sy - v.h * HORIZON, 8)
 const d = lens.focal * (lens.eye + lens.camZ) / below
 return { x: c.x + (sx - v.w / 2) * d / lens.focal, y: Math.max(0, c.y + lens.back - d) }
}

/* ============================ the sheet ============================ */
const REST = 0.52, UP = 0.11, SLOP = 6
const sheet = $('sheet'), scroller = $('sheetScroll'), grab = $('sheetGrab')
let drag = null
const stage = document.querySelector('.stage')
function setLift(v) {
 S.lift = Math.min(1, Math.max(0, v))
 stage.style.setProperty('--lift', String(S.lift))
 $('chip').dataset.away = String(S.lift > 0.72)
 grab.setAttribute('aria-expanded', String(S.lift > 0.5))
 grab.setAttribute('aria-label', S.lift > 0.5 ? 'Lower the panel' : 'Raise the panel')
 sheet.dataset.lifted = String(S.lift > 0.5)
}
function startDrag(e, collapseOnly) {
 if (collapseOnly && scroller.scrollTop > 0) return
 drag = { y: e.clientY, from: S.lift, at: performance.now(), last: e.clientY, v: 0, moved: false, collapseOnly }
}
function moveDrag(e) {
 if (!drag) return
 const dy = e.clientY - drag.y
 if (drag.collapseOnly && dy <= SLOP) return
 if (!drag.moved && Math.abs(dy) < SLOP) return
 if (!drag.moved) { drag.moved = true; stage.dataset.dragging = 'true' }
 setLift(drag.from - dy / (window.innerHeight * (REST - UP)))
 const now = performance.now()
 drag.v = (e.clientY - drag.last) / Math.max(now - drag.at, 1)
 drag.last = e.clientY; drag.at = now
}
function endDrag() {
 const d = drag; drag = null
 stage.dataset.dragging = 'false'
 if (!d || !d.moved) return
 if (Math.abs(d.v) > 0.5) setLift(d.v < 0 ? 1 : 0)
 else setLift(S.lift > 0.5 ? 1 : 0)
}
grab.addEventListener('pointerdown', e => { grab.setPointerCapture(e.pointerId); startDrag(e, false) })
grab.addEventListener('pointermove', moveDrag)
grab.addEventListener('pointerup', () => { const wasDrag = drag && drag.moved; endDrag(); if (!wasDrag) setLift(S.lift > 0.5 ? 0 : 1) })
grab.addEventListener('pointercancel', endDrag)
scroller.addEventListener('pointerdown', e => startDrag(e, true))
scroller.addEventListener('pointermove', moveDrag)
scroller.addEventListener('pointerup', endDrag)
scroller.addEventListener('pointercancel', endDrag)
setLift(0)

/* ============================ overlays ============================ */
const scrim = $('scrim'), curtain = $('curtain'), curtainBody = $('curtainBody')
function openScrim(html) { $('scrimBody').innerHTML = html; scrim.hidden = false }
function closeScrim() { scrim.hidden = true; $('scrimBody').innerHTML = '' }
scrim.addEventListener('pointerdown', e => { if (e.target === scrim) closeScrim() })
function openCurtain(html) { curtainBody.innerHTML = html; curtain.hidden = false }
function closeCurtain() { curtain.hidden = true; curtainBody.innerHTML = '' }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeScrim(); closeCurtain(); closeStory(); closeCamera() } })

function openCase(call) {
 const f = flowerSpec(call.flower), who = person(call.person), feel = FEELINGS[call.feeling]
 const rows = [['Date', new Date(call.at).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })], ['Duration', fmtDuration(call.minutes)]]
 if (call.topic) rows.push(['What it was about', call.topic])
 rows.push(['How you felt', feel.label + ', ' + feel.caption.toLowerCase().replace(/\.$/, '')])
 openScrim('<div class="panel">' +
  '<div class="vitrine"><span class="vitrine-shadow"></span><span class="vitrine-stage">' + flowerSVG(call.flower, 110) + '</span></div>' +

  '<button class="btn btn-soft btn-block" style="margin-top:10px" data-close>Leave It Growing</button></div>')
 $('scrimBody').querySelector('[data-close]').onclick = closeScrim
}

/** 0 (never, or long forgotten) to 1 (called today, and often this fortnight). */
function callingVitality() {
 const calls = CALLS.slice().sort((a, b) => b.at.localeCompare(a.at))
 if (!calls.length) return -1
 const daysSince = Math.max(0, (Date.now() - new Date(calls[0].at).getTime()) / 86400000)
 const freshness = Math.pow(2, -daysSince / 4)
 const cutoff = Date.now() - 14 * 86400000
 const recent = calls.filter(m => new Date(m.at).getTime() >= cutoff).length
 const frequency = Math.min(1, recent / 6)
 return Math.max(0, Math.min(1, freshness * 0.65 + frequency * 0.35))
}
function callingStage() {
 const v = callingVitality()
 if (v < 0) return 'bud'
 if (v >= 0.82) return 'full'
 if (v >= 0.56) return 'blooming'
 if (v >= 0.32) return 'withering'
 if (v >= 0.12) return 'shedding'
 return 'dying'
}
function growthFlowerSVG() {
 const stage = callingStage(), info = GROWTH_STAGES.find(g => g.id === stage)
 return '<svg class="feelings-sprig" viewBox="0 0 64 78" fill="none" role="img" aria-label="' + esc(info.label + '. ' + info.caption) + '">' + GROWTH_SVG[stage] + '</svg>'

/* ---------- the week ---------- */
const SLOT = 30, HOUR_PX = 40, OPEN = 7 * 60, CLOSE = 22 * 60
const LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
const clockLabel = m => (Math.floor(m / 60) % 12 || 12) + ':' + String(m % 60).padStart(2, '0') + (m >= 720 ? ' pm' : ' am')
const hourLabel = m => (Math.floor(m / 60) % 12 || 12) + (m < 720 ? 'a' : 'p')
const mondayOf = date => { const d = new Date(date); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d }
const weekDays = from => Array.from({ length: 7 }, (_, i) => { const d = new Date(from); d.setDate(d.getDate() + i); return d })
function freeWindows(blocks) {
 const sorted = blocks.slice().sort((a, b) => a.start - b.start)
 const out = []; let cursor = OPEN
 for (const b of sorted) {
  if (b.end <= cursor) continue
  if (b.start > cursor) out.push({ start: cursor, end: Math.min(b.start, CLOSE) })
  cursor = Math.max(cursor, b.end)
  if (cursor >= CLOSE) break
 }
 if (cursor < CLOSE) out.push({ start: cursor, end: CLOSE })
 return out.filter(v => v.end - v.start >= 20)
}

  if (storyHeld) { storyStart = performance.now() - storyElapsed; return }
  storyElapsed = performance.now() - storyStart
  const p = Math.min(1, storyElapsed / STORY_MS)
  const bar = $('storyBars').children[storyIndex]
  if (bar) bar.firstElementChild.style.width = (p * 100) + '%'
  if (p >= 1) { if (storyIndex + 1 < S.instants.length) { storyIndex++; storyElapsed = 0; storyStart = performance.now(); paintStory() } else closeStory() }
 }
 storyFrame = requestAnimationFrame(tick)
}
function closeStory() { $('story').hidden = true; cancelAnimationFrame(storyFrame) }
function paintStory() {
 const s = S.instants[storyIndex], who = person(s.person)
 $('storyBars').innerHTML = S.instants.map((_, i) =>
  '<span class="story-bar"><i style="width:' + (i < storyIndex ? '100%' : '0%') + '"></i></span>').join('')
 const ago = s.ago < 60 ? s.ago + 'm' : s.ago < 1440 ? Math.round(s.ago / 60) + 'h' : Math.round(s.ago / 1440) + 'd'
 $('storyWho').innerHTML = '<b>' + esc(who.name) + '</b><span>' + ago + '</span>'
 $('storyAvatar').className = 'avatar avatar-' + who.tone + ' avatar-sm'
 $('storyAvatar').textContent = who.initials
 $('storyFrame').className = 'story-frame tint-' + who.tone
 $('storyFrame').innerHTML = '<span class="story-empty" style="display:grid;place-items:center">' + flowerSVG(who.bag[0], 120) + '</span>' +
  '<span class="story-caption">' + esc(s.caption) + '</span>'
 $('storyKeep').setAttribute('aria-pressed', String(!!s.saved))
 $('storyKeep').setAttribute('aria-label', s.saved ? 'Remove from your scrapbook' : 'Keep in your scrapbook')
}
$('storyClose').onclick = closeStory
$('storyPrev').onclick = () => { if (storyIndex > 0) { storyIndex--; storyElapsed = 0; storyStart = performance.now(); paintStory() } }
$('storyNext').onclick = () => { if (storyIndex + 1 < S.instants.length) { storyIndex++; storyElapsed = 0; storyStart = performance.now(); paintStory() } else closeStory() }
$('storyStage').addEventListener('pointerdown', () => { storyHeld = true })
$('storyStage').addEventListener('pointerup', () => { storyHeld = false })
$('storyStage').addEventListener('pointercancel', () => { storyHeld = false })
$('storyKeep').onclick = () => { const s = S.instants[storyIndex]; s.saved = !s.saved; paintStory(); toast(s.saved ? 'Kept in your scrapbook.' : 'Let it fade.') }
$('storyReply').addEventListener('submit', e => {
 e.preventDefault()
 const input = $('storyInput')
 if (!input.value.trim()) return
 const who = person(S.instants[storyIndex].person)
 input.value = ''
 toast('Sent to ' + who.name + '.')
})

let camStream = null
function openCamera() {
 $('camera').hidden = false
 stage.dataset.camera = 'true'
 S.camera = true
 const video = $('camFeed')
 navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
  .then(s => { camStream = s; video.srcObject = s; video.play().catch(() => {}) })
  .catch(() => { $('camFallback').hidden = false; video.hidden = true })
 if (!navigator.mediaDevices) { $('camFallback').hidden = false; video.hidden = true }
}
function closeCamera() {
 $('camera').hidden = true
 stage.dataset.camera = 'false'
 S.camera = false
 if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null }
}
$('camClose').onclick = closeCamera
$('camShutter').onclick = () => { closeCamera(); toast('Caught it. It fades unless somebody keeps it.') }
$('camAudience').onclick = e => {
 const b = e.currentTarget
 b.dataset.close = b.dataset.close === '1' ? '0' : '1'
 b.firstChild.textContent = b.dataset.close === '1' ? 'Close family ' : 'Your people '
}

/* ============================ the call, and the cue ============================ */
let callState = null, callTimer = null
const clock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
function startCall(id) {
 const who = person(id)
 callState = { id, seconds: 0, minutes: 1, feeling: 'steady', flower: 'daisy', topic: '' }
 openCurtain('<span class="eyebrow">Simulated call · no audio</span>' +
  '<span class="halo"><span class="avatar avatar-' + who.tone + ' avatar-xl">' + who.initials + '</span></span>' +
  '<h1 class="curtain-title">' + esc(who.name) + '</h1><p class="timer" id="callTimer">0:00</p>' +
  '<p class="curtain-sub">Talk for as long or as little as suits you. Two minutes counts.</p>' +
  '<button class="btn btn-block" id="endCall">End Call</button>' +
  '<button class="btn btn-quiet" id="cancelCall">never mind, back out</button>')
 clearInterval(callTimer)
 callTimer = setInterval(() => { callState.seconds++; const t = $('callTimer'); if (t) t.textContent = clock(callState.seconds) }, 1000)
 $('endCall').onclick = () => { clearInterval(callTimer); callState.minutes = Math.max(1, Math.round(callState.seconds / 60)); reflect() }
 $('cancelCall').onclick = () => { clearInterval(callTimer); closeCurtain() }
}
function reflect() {
 openCurtain('<span class="eyebrow">Just for you</span><h1 class="curtain-title">How did that feel?</h1>' +
  '<div class="chips" style="justify-content:center">' + Object.keys(FEELINGS).map(k =>
   '<button class="chip-choice" data-feel="' + k + '" aria-pressed="' + (callState.feeling === k) + '">' + FEELINGS[k].label + '</button>').join('') + '</div>' +
  '<p class="small" id="feelCaption">' + FEELINGS[callState.feeling].caption + '</p>' +
  '<div class="switch-row" style="width:100%"><b>About how long?</b><span style="display:flex;align-items:center;gap:10px">' +
   '<button class="cal-step" id="less" aria-label="Shorter">' + I.minus + '</button>' +
   '<span id="mins" style="font-family:var(--round);font-weight:700;min-width:78px;text-align:center">' + fmtDuration(callState.minutes) + '</span>' +
   '<button class="cal-step" id="more" aria-label="Longer">' + I.plus + '</button></span></div>' +
  '<div style="width:100%"><label class="label" for="aboutWhat">What was it about? (optional)</label>' +
  '<input class="input" id="aboutWhat" maxlength="90" placeholder="the tomatoes, mostly…" autocomplete="off"></div>' +
  '<button class="btn btn-block" id="toFlower">Choose a Flower</button>')
 curtainBody.querySelectorAll('[data-feel]').forEach(b => b.onclick = () => {
  callState.feeling = b.dataset.feel
  curtainBody.querySelectorAll('[data-feel]').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
  $('feelCaption').textContent = FEELINGS[callState.feeling].caption
 })
 const step = () => callState.minutes >= 15 ? 5 : 1
 $('less').onclick = () => { callState.minutes = Math.max(1, callState.minutes - step()); $('mins').textContent = fmtDuration(callState.minutes) }
 $('more').onclick = () => { callState.minutes = Math.min(180, callState.minutes + step()); $('mins').textContent = fmtDuration(callState.minutes) }
 $('toFlower').onclick = () => { callState.topic = $('aboutWhat').value.trim(); pickFlower() }
}
function pickFlower() {
 callState.flower = FEELINGS[callState.feeling].flower
 openCurtain('<span class="eyebrow">' + esc(person(callState.id).name) + '&rsquo;s patch</span>' +
  '<h1 class="curtain-title">Which flower was it?</h1>' +
  '<p class="curtain-sub">Picked for a ' + FEELINGS[callState.feeling].label.toLowerCase() + ' call. Pick another if it is not.</p>' +
  '<div class="flower-grid">' + flowerLibrary.map(f =>
   '<button class="flower-option" role="radio" data-kind="' + f.id + '" aria-checked="' + (f.id === callState.flower) + '">' +
   flowerSVG(f.id, 40) + '<b>' + f.name + '</b><span>' + f.note + '</span></button>').join('') + '</div>' +
  '<button class="btn btn-block" id="plant">Plant It</button>')
 curtainBody.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
  callState.flower = b.dataset.kind
  curtainBody.querySelectorAll('[data-kind]').forEach(x => x.setAttribute('aria-checked', String(x === b)))
 })
 $('plant').onclick = plant
}
function plant() {
 const who = person(callState.id)
 const id = who.id + '-new-' + CALLS.length
 CALLS.push({ id, person: who.id, minutes: callState.minutes, at: new Date().toISOString(), flower: callState.flower, feeling: callState.feeling, topic: callState.topic || null })
 who.count++
 signature = ''
 S.fresh = id
 setTimeout(() => { S.fresh = null }, 6000)
 openCurtain('<span class="eyebrow">' + fmtDuration(callState.minutes) + ' together</span>' +
  '<div class="bloom-stage"><div style="animation:pop .8s cubic-bezier(.25,1.2,.35,1) both;transform-origin:50% 100%">' +
   flowerSVG(callState.flower, Math.round(110 * bloomScale(callState.minutes))) + '</div></div>' +
  '<h1 class="curtain-title">It opened.</h1>' +
  '<p class="curtain-sub">A longer call opens a fuller bloom. This one is planted in ' + esc(who.name) + '&rsquo;s patch, and it stays there.</p>' +
  '<button class="btn btn-block" id="toGarden">Back to Your Garden</button>')
 $('toGarden').onclick = () => { closeCurtain(); route('home'); setLift(0) }
}
const bloomScale = m => Math.min(1.5, Math.max(0.7, 0.6 + Math.sqrt(m) / 7))

function fireCue() {
 const who = PEOPLE[0]
 try { navigator.vibrate && navigator.vibrate([180, 110, 180, 110, 260]) } catch (e) { /* vibration blocked; the cue still shows */ }
 ringTone(3)
 openCurtain('<div style="display:flex;align-items:center;justify-content:space-between;width:100%;font-family:var(--round);font-size:13px;color:var(--ink-soft)"><span>harbor</span><span>now</span></div>' +
  '<span class="halo"><span class="avatar avatar-' + who.tone + ' avatar-xl">' + who.initials + '</span></span>' +
  '<p style="font-family:var(--round);font-weight:700;font-size:23px;color:var(--ink-deep)">' + esc(who.name) + '</p>' +
  '<h1 class="curtain-title">Looks like you&rsquo;re free.</h1>' +
  '<p class="curtain-sub">You just stopped walking, so this is a good moment if you want it.</p>' +
  '<div class="chips" style="justify-content:center">' + ['Catch up', 'Ask for help', 'Share news', 'Just because'].map(t =>
   '<button class="chip-choice" data-topic="' + t + '" aria-pressed="false">' + t + '</button>').join('') + '</div>' +
  '<div class="paths">' +
   '<button class="path" id="cueCall"><span class="path-icon">' + I.phone + '</span><b>Call now</b><span>~12 min, usually</span></button>' +
   '<button class="path" id="cueLove"><span class="path-icon">' + I.heart + '</span><b>Send a reaction</b><span>a photo, one line</span></button>' +
   '<button class="path" id="cueLater"><span class="path-icon">' + I.clock + '</span><b>Propose a later time</b><span>becomes today&rsquo;s next nudge</span></button></div>' +
  '<button class="btn btn-quiet" id="cueOut">not now</button>' +
  '<p class="note-strip">' + I.shield + 'Your walking stays on this phone. ' + esc(who.name) + ' never sees it.</p>')
 curtainBody.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
  const on = b.getAttribute('aria-pressed') === 'true'
  curtainBody.querySelectorAll('[data-topic]').forEach(x => x.setAttribute('aria-pressed', 'false'))
  b.setAttribute('aria-pressed', String(!on))
 })
 $('cueCall').onclick = () => startCall(who.id)
 $('cueLove').onclick = () => { closeCurtain(); toast('Sent. Nothing owed either way.') }
 $('cueLater').onclick = () => { closeCurtain(); toast('Saved. You will see it when the time comes.') }
 $('cueOut').onclick = () => { closeCurtain(); toast('Kept a little space for yourself.') }
}
/** The window both of you agreed to. It opens like a flower, not like an alert. */
function openWindow() {
 try { navigator.vibrate && navigator.vibrate([140, 90, 200]) } catch (e) { /* vibration blocked; the card still opens */ }
 const names = PEOPLE.slice(0, 2).map(p => p.name).join(' and ')
 openScrim('<div class="window-card">' +
  '<span class="window-bloom"><span class="window-ring"></span><span class="window-ring"></span>' + flowerSVG('cosmos', 58) + '</span>' +
  '<span class="eyebrow" style="display:block;margin-top:10px">Your window is open</span>' +
  '<h2 style="font-size:27px;color:var(--ink-deep);letter-spacing:-.6px;margin:6px 0">It&rsquo;s time.</h2>' +
  '<p class="small" style="margin-bottom:16px">Whatever you&rsquo;re doing right now. That&rsquo;s the one. ' +
   esc(names) + ' got the same nudge at the same moment.</p>' +
  '<button class="btn btn-block" id="winTake">' + I.camera + 'Take It</button>' +
  '<button class="btn btn-quiet btn-block" style="margin-top:6px" id="winSkip">skip today</button></div>')
 $('winTake').onclick = () => { closeScrim(); openCamera() }
 $('winSkip').onclick = () => { closeScrim(); toast('Let it pass. There is another one tomorrow.') }
}

function ringTone(times) {
 try {
  const actx = new (window.AudioContext || window.webkitAudioContext)()
  for (let i = 0; i < times; i++) {
   const at = actx.currentTime + i * 1.25
   const osc = actx.createOscillator(), gain = actx.createGain()
   osc.connect(gain); gain.connect(actx.destination); osc.type = 'sine'
   osc.frequency.setValueAtTime(660, at); osc.frequency.exponentialRampToValueAtTime(495, at + 0.5)
   gain.gain.setValueAtTime(0.0001, at); gain.gain.exponentialRampToValueAtTime(0.09, at + 0.04); gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.9)
   osc.start(at); osc.stop(at + 0.95)
  }
 } catch (e) { /* no audio here; the cue is still a cue */ }
}

/* ---------- today's question, once the app has settled ---------- */
const QUESTIONS = [
 { q: 'Tea, coffee, or neither today?', mom: 'Chai, obviously. Extra ginger today.', dad: 'Black coffee. The tomatoes needed watering early.' },
 { q: 'One good thing about today, however small?', mom: 'The jasmine finally opened.', dad: 'Found my old radio in the garage. Still works.' },
 { q: 'Early bird or night owl, honestly?', mom: 'Early bird. Mornings feel like mine.', dad: 'Night owl, but I pretend otherwise.' },
]
const TODAY_Q = QUESTIONS[new Date().getDate() % QUESTIONS.length]
function askQuestion() {
 openCurtain('<span class="eyebrow">Today&rsquo;s little question</span>' +
  '<h1 class="curtain-title">' + esc(TODAY_Q.q) + '</h1>' +
  '<p class="curtain-sub">No streak to keep. Answer today, skip tomorrow, either is fine.</p>' +
  '<div style="width:100%"><textarea class="input" id="answer" maxlength="200" placeholder="Whatever comes to mind…"></textarea></div>' +
  '<button class="btn btn-block" id="shareAnswer">Share My Answer</button>' +
  '<button class="btn btn-quiet" id="skipQ">Not today</button>')
 $('shareAnswer').onclick = () => {
  const mine = $('answer').value.trim() || '…'
  openCurtain('<span class="eyebrow">Today&rsquo;s little question</span><h1 class="curtain-title">' + esc(TODAY_Q.q) + '</h1>' +
   '<div class="flow" style="width:100%">' +
   [['mom', TODAY_Q.mom], ['dad', TODAY_Q.dad]].map(([id, txt]) => {
    const p = person(id)
    return '<div class="row"><span class="avatar avatar-' + p.tone + ' avatar-sm">' + p.initials + '</span>' +
     '<span class="row-body"><b>' + p.name + '</b><span>' + esc(txt) + '</span></span></div>'
   }).join('') +
   '<div class="row" style="background:var(--tint-mint);box-shadow:none"><span class="avatar avatar-sky avatar-sm">Y</span>' +
   '<span class="row-body"><b>You</b><span>' + esc(mine) + '</span></span></div></div>' +
   '<button class="btn btn-block" id="doneQ">Back to Your Garden</button>')
  $('doneQ').onclick = closeCurtain
 }
 $('skipQ').onclick = closeCurtain
}

/* ---------- go ---------- */
applyTheme()
route('home')
setTimeout(askQuestion, 1200)

})();
</script>
