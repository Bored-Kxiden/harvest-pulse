<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#9ECDE8"/>
<title>Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* The two families the app actually uses. The handwriting is gone. */
:root {
 --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
 --font-round: 'Quicksand', ui-rounded, 'Nunito', sans-serif;
 --body: var(--font-body);
 --round: var(--font-round);
}
:root {
 color-scheme: light;
 --ivory: #FAF5EA;
 --ivory-deep: #F3EBDA;
 --paper: #FEFCF5;
 --ink: #1F6B43;
 --ink-deep: #13492C;
 --ink-mid: #4C6B52;
 --ink-soft: #7C8C7E;
 --ink-faint: #A6B0A4;
 --gold: #F2C75C;
 --gold-soft: #FBEECB;
 --leaf: #59A468;
 --leaf-bright: #79BC7F;
 --blush: #EE9A4D;
 --rose: #D98A86;

 --tint-yellow: #FBF2D4;
 --tint-mint: #E2EFDC;
 --tint-rose: #FBE5E3;
 --tint-lilac: #ECE7F8;
 --tint-blue: #E1EDF8;
 --tint-peach: #FCE2D0;
 --av-gold: #F7D179; --av-mint: #BCDDC0; --av-rose: #F6B8B4; --av-blue: #A9C9EE;

 --shadow-soft: 0 10px 30px -20px rgb(31 107 67 / .55);
 --shadow-card: 0 14px 34px -26px rgb(31 107 67 / .7);
 --shadow-lift: 0 -14px 44px -20px rgb(24 70 46 / .3);
 --hairline: rgb(31 107 67 / .09);

 --background: var(--ivory);
 --foreground: var(--ink-deep);
 --primary: var(--ink);
 --primary-foreground: #FEFCF5;
 --card: var(--paper);
 --card-foreground: var(--ink-deep);
 --popover: var(--paper);
 --popover-foreground: var(--ink-deep);
 --secondary: #E4F0E2;
 --secondary-foreground: var(--ink);
 --muted: #F1E9D8;
 --muted-foreground: #6F8272;
 --accent: var(--gold);
 --accent-foreground: #4A3A16;
 --destructive: #B4664A;
 --border: rgb(31 107 67 / .12);
 --input: rgb(31 107 67 / .18);
 --ring: var(--leaf);
 --radius: 1.4rem;

 /* Canvas cannot read the rest of these, so the two the meadow needs are named here
    and lifted out of the computed style when the theme moves. */
 --tag-face: #FEFCF5;
 --tag-ink: #13492C;

 /* The card's paper grain, and whether the meadow is at dusk. */
 --dots: rgb(31 107 67 / .07);
 --night: 0;

 /* Surfaces that float over the meadow, and the halo that keeps text off it. */
 --float: rgb(254 252 245 / .94);
 --float-soft: rgb(254 252 245 / .7);
 --glow: rgb(255 255 255 / .6);
 --glass: rgb(255 255 255 / .85);
 --case: linear-gradient(164deg, #ECF6EC 0%, #D8EBDB 56%, #C3DEC8 100%);
 --sprout: #C9E5C7;
 --foot: 124px;   /* how far the verge grows up from the bottom of the screen */
 --verge-light: 1; --verge-sat: 1;
 --soft: #E4F0E2; --soft-hover: #D7E9D5; --track: #DCE5D7;
 --wash: rgb(31 107 67 / .06); --on-ink: #FEFCF5;
}

/* ---------- dusk ----------
   One palette, written twice because CSS has no other way to say "these two
   selectors carry the same tokens": once for the system preference, once for the
   choice made in Account, which must win in both directions. */
@media (prefers-color-scheme: dark) {
 :root:not([data-theme='light']) {
 color-scheme: dark;
 /* Dusk in the same meadow, not a different app: the greens go to the colour of
    leaves after sunset, the paper becomes the last warm light on it, and gold is
    still the thing you chose last. */
 --ivory: #10150F;
 --ivory-deep: #0A0E09;
 --paper: #19201A;
 --ink: #86C892;
 --ink-deep: #EEF4E7;
 --ink-mid: #B2C4B0;
 --ink-soft: #8E9E8C;
 --ink-faint: #6A7868;
 --gold: #F2C75C;
 --gold-soft: #3A3116;
 --leaf: #6FB77C;
 --leaf-bright: #8FCE97;
 --blush: #F0A863;
 --rose: #E29C97;

 --tint-yellow: #2C2818;
 --tint-mint: #1C2A1E;
 --tint-rose: #2E2020;
 --tint-lilac: #232134;
 --tint-blue: #1B2632;
 --tint-peach: #2F2419;
 --av-gold: #B99648; --av-mint: #6E9B72; --av-rose: #A8706D; --av-blue: #6486A8;

 --shadow-soft: 0 10px 30px -20px rgb(0 0 0 / .9);
 --shadow-card: 0 14px 34px -24px rgb(0 0 0 / .95);
 --shadow-lift: 0 -16px 48px -20px rgb(0 0 0 / .75);
 --hairline: rgb(160 200 165 / .13);

 --background: var(--ivory);
 --foreground: var(--ink-deep);
 --primary: var(--leaf);
 --primary-foreground: #0C120C;
 --card: var(--paper);
 --card-foreground: var(--ink-deep);
 --popover: var(--paper);
 --popover-foreground: var(--ink-deep);
 --secondary: #233026;
 --secondary-foreground: var(--ink);
 --muted: #222A21;
 --muted-foreground: #97A695;
 --accent: var(--gold);
 --accent-foreground: #1A1405;
 --destructive: #D08468;
 --border: rgb(160 200 165 / .14);
 --input: rgb(160 200 165 / .22);
 --ring: var(--leaf);

 --tag-face: #1F2720;
 --tag-ink: #E7F0E2;

 --float: rgb(26 33 27 / .92);
 --float-soft: rgb(26 33 27 / .7);
 --glow: rgb(8 14 9 / .7);
 --glass: rgb(120 160 126 / .16);
 --case: linear-gradient(164deg, #20301F 0%, #1B2A1D 56%, #16241A 100%);
 --sprout: #26351F;
 --verge-light: .42; --verge-sat: .72;
 --soft: #23301F; --soft-hover: #2B3A26; --track: #2D3A2C;
 --wash: rgb(160 200 165 / .09); --on-ink: #0C120C;

 --dots: rgb(180 214 182 / .07);
 --night: 1;
 }
}
:root[data-theme='dark'] {
 color-scheme: dark;
 /* Dusk in the same meadow, not a different app: the greens go to the colour of
    leaves after sunset, the paper becomes the last warm light on it, and gold is
    still the thing you chose last. */
 --ivory: #10150F;
 --ivory-deep: #0A0E09;
 --paper: #19201A;
 --ink: #86C892;
 --ink-deep: #EEF4E7;
 --ink-mid: #B2C4B0;
 --ink-soft: #8E9E8C;
 --ink-faint: #6A7868;
 --gold: #F2C75C;
 --gold-soft: #3A3116;
 --leaf: #6FB77C;
 --leaf-bright: #8FCE97;
 --blush: #F0A863;
 --rose: #E29C97;

 --tint-yellow: #2C2818;
 --tint-mint: #1C2A1E;
 --tint-rose: #2E2020;
 --tint-lilac: #232134;
 --tint-blue: #1B2632;
 --tint-peach: #2F2419;
 --av-gold: #B99648; --av-mint: #6E9B72; --av-rose: #A8706D; --av-blue: #6486A8;

 --shadow-soft: 0 10px 30px -20px rgb(0 0 0 / .9);
 --shadow-card: 0 14px 34px -24px rgb(0 0 0 / .95);
 --shadow-lift: 0 -16px 48px -20px rgb(0 0 0 / .75);
 --hairline: rgb(160 200 165 / .13);

 --background: var(--ivory);
 --foreground: var(--ink-deep);
 --primary: var(--leaf);
 --primary-foreground: #0C120C;
 --card: var(--paper);
 --card-foreground: var(--ink-deep);
 --popover: var(--paper);
 --popover-foreground: var(--ink-deep);
 --secondary: #233026;
 --secondary-foreground: var(--ink);
 --muted: #222A21;
 --muted-foreground: #97A695;
 --accent: var(--gold);
 --accent-foreground: #1A1405;
 --destructive: #D08468;
 --border: rgb(160 200 165 / .14);
 --input: rgb(160 200 165 / .22);
 --ring: var(--leaf);

 --tag-face: #1F2720;
 --tag-ink: #E7F0E2;

 --float: rgb(26 33 27 / .92);
 --float-soft: rgb(26 33 27 / .7);
 --glow: rgb(8 14 9 / .7);
 --glass: rgb(120 160 126 / .16);
 --case: linear-gradient(164deg, #20301F 0%, #1B2A1D 56%, #16241A 100%);
 --sprout: #26351F;
 --verge-light: .42; --verge-sat: .72;
 --soft: #23301F; --soft-hover: #2B3A26; --track: #2D3A2C;
 --wash: rgb(160 200 165 / .09); --on-ink: #0C120C;

 --dots: rgb(180 214 182 / .07);
 --night: 1;
 }

*, *::before, *::after { box-sizing: border-box; border-color: var(--border); border-style: solid; border-width: 0 }
img, svg, video, canvas { display: block; max-width: 100% }
html, body { height: 100%; overscroll-behavior: none; }
body { background: var(--background); color: var(--foreground); font-family: var(--font-body), ui-sans-serif, system-ui, sans-serif; margin: 0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button:not(:disabled), [role='button']:not(:disabled), a, label.tap { cursor: pointer; touch-action: manipulation; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0 }
input, textarea, select { font: inherit }
a { text-decoration: none; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [role='slider']:focus-visible, [tabindex]:focus-visible {
 outline: 2.5px solid var(--leaf); outline-offset: 3px; border-radius: 10px;
}
h1, h2, h3, h4 { font-family: var(--font-round), ui-rounded, sans-serif; text-wrap: balance; margin: 0; }
p { line-height: 1.55; margin: 0; }
[hidden] { display: none !important }


/* ---------- the viewport ---------- */
.stage {
 /* clip, not hidden: the sheet hangs past the foot of the stage, and `hidden` would
    make that a scroll container the browser can shunt on focus, dragging every
    overlay off screen with it. */
 position: fixed; inset: 0; overflow: clip;
 max-width: 480px; margin-inline: auto; background: var(--ivory);
 box-shadow: 0 0 80px -30px rgb(24 70 46 / .35);
}
@media (min-width: 520px) { body { background: #E9DFCC } }
.meadow { position: absolute; inset: 0; z-index: 0 }
.meadow-canvas { display: block; width: 100%; height: 100%; touch-action: manipulation }
.meadow-canvas:focus-visible { outline: 2.5px solid var(--leaf); outline-offset: -4px; border-radius: 4px }

/* ---------- what floats over the meadow ---------- */
.topbar {
 position: absolute; z-index: 12; top: calc(env(safe-area-inset-top) + 12px); left: 20px; right: 16px;
 display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none;
}
.topbar > * { pointer-events: auto }
.brand { display: flex; align-items: flex-start; gap: 8px; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -.6px; color: var(--ink); text-shadow: 0 2px 12px var(--glow) }
.brand svg { width: 27px; height: 27px; flex-shrink: 0; margin-top: 3px }
.brand-stack { display: flex; flex-direction: column }
.brand-word { line-height: 1 }
.brand-line { font-family: var(--font-round), ui-rounded, sans-serif; font-weight: 500; font-size: 16px; line-height: 1.08; color: var(--ink-mid); margin-top: 3px; letter-spacing: .2px; max-width: 130px; text-shadow: 0 1px 8px var(--glow) }
.top-acts { display: flex; align-items: center; gap: 9px }
.disc {
 position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
 background: var(--float); box-shadow: var(--shadow-soft); color: var(--ink); flex-shrink: 0;
 transition: transform .22s cubic-bezier(.22,.9,.28,1), background .2s;
}
.disc:hover { background: #fff }
.disc:active { transform: scale(.93) }
.disc svg { width: 20px; height: 20px; stroke-width: 1.9 }
.disc[data-tint='leaf'] { background: var(--sprout) }
.disc i { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }
@keyframes settle { from { opacity: 0; transform: rotate(-3.5deg) translateY(-8px) } to { opacity: 1; transform: rotate(-3.5deg) translateY(0) } }

/* ---------- the instants rail ---------- */

/* ---------- the meadow chip ----------
   One pill, two taps: the glyph on the left turns the weather over on its own; the
   label is a button in its own right that opens the garden's map, so tapping "your
   garden is blooming" does something a pinch cannot: takes you straight to a person. */
.meadow-chip {
 position: absolute; z-index: 11; left: 18px; bottom: calc(48dvh + 16px); display: flex; align-items: center;
 transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0);
 border-radius: 99px; background: var(--float); box-shadow: var(--shadow-card);
 transition: transform .42s cubic-bezier(.22, .9, .28, 1), opacity .3s;
}
.meadow-chip-icon, .meadow-chip-label { display: flex; align-items: center; gap: 9px; min-height: 44px }
.meadow-chip-icon { padding: 0 6px 0 13px }
.meadow-chip-label { padding: 0 15px 0 3px; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink-deep); white-space: nowrap }
.meadow-chip-icon:active, .meadow-chip-label:active { transform: scale(.96) }
.meadow-chip svg { width: 18px; height: 18px; flex-shrink: 0 }
.meadow-chip .caret { width: 14px; height: 14px; stroke-width: 2.4; color: var(--ink-faint) }
/* The weather glyph turns over as the sky does. */
.weather-turn { display: grid; place-items: center; width: 20px; height: 20px }
.weather-turn > * { grid-area: 1 / 1; animation: turn-in .62s cubic-bezier(.22,.9,.28,1) both }
@keyframes turn-in { from { opacity: 0; transform: rotate(-110deg) scale(.5) } to { opacity: 1; transform: none } }

/* ---------- the sheet ---------- */
.sheet {
 position: absolute; left: 0; right: 0; top: 52dvh; height: 89dvh; z-index: 20;
 transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0);
 transition: transform .42s cubic-bezier(.22, .9, .28, 1);
 display: flex; flex-direction: column;
 background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory) 62%, var(--ivory-deep) 100%);
 border-radius: 30px 30px 0 0; box-shadow: var(--shadow-lift);
 overscroll-behavior: contain;
}
.stage[data-dragging='true'] .sheet,
.stage[data-dragging='true'] .meadow-chip { transition: none }
.meadow-chip[data-away='true'] { opacity: 0; pointer-events: none }

/* ---------- zoom, as buttons ----------
   Sitting at the edge of a thumb's reach on the right, the way a map app's own
   zoom rocker does, since pinch and double tap are easy to miss on a first visit. */
.meadow-zoom {
 position: absolute; z-index: 11; right: 14px; top: 23dvh; display: flex; flex-direction: column;
 border-radius: 20px; overflow: hidden; background: var(--float); box-shadow: var(--shadow-card);
 transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0);
 transition: transform .42s cubic-bezier(.22, .9, .28, 1), opacity .3s;
}
.meadow-zoom button { display: grid; place-items: center; width: 44px; height: 44px; color: var(--ink-deep) }
.meadow-zoom button:active { background: var(--wash) }
.meadow-zoom button:first-child { border-bottom: 1px solid var(--hairline) }
.meadow-zoom svg { width: 19px; height: 19px; stroke-width: 2.2 }
.meadow-zoom[data-away='true'] { opacity: 0; pointer-events: none }
.stage[data-dragging='true'] .meadow-zoom { transition: none }
.sheet::before {
 content: ''; position: absolute; inset: 0 0 auto; height: 30px; border-radius: 30px 30px 0 0;
 box-shadow: inset 0 1.5px 0 var(--glass); pointer-events: none; z-index: 2;
}
/* The card's grain: a dot grid that fades out as it goes down, so the top of the
   panel has texture to catch the light and the bottom stays quiet under the nav. */
.sheet::after {
 content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
 border-radius: 30px 30px 0 0;
 background-image: radial-gradient(var(--dots) 1.1px, transparent 1.1px);
 background-size: 17px 17px; background-position: 6px 6px;
 -webkit-mask-image: linear-gradient(180deg, #000 0 46%, rgb(0 0 0 / .25) 78%, transparent 100%);
 mask-image: linear-gradient(180deg, #000 0 46%, rgb(0 0 0 / .25) 78%, transparent 100%);
}
.sheet-grab, .sheet-scroll { position: relative; z-index: 1 }
.sheet-grab { display: grid; place-items: center; width: 100%; height: 44px; margin-bottom: -18px; flex-shrink: 0; touch-action: none }
.sheet-grab span { width: 42px; height: 5px; border-radius: 99px; background: #CFD8C9; transition: background .2s, width .24s cubic-bezier(.22,.9,.28,1) }
.sheet-grab:hover span { background: #B9C6B2; width: 52px }
/* The sheet is cut for its lifted height, so while it is down its tail hangs past the
   foot of the stage. Pad the scroll by exactly that overhang and the last row can still
   be brought onto the screen; lifted, the overhang is gone and so is the padding. */
.sheet-scroll {
 flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
 padding-bottom: calc(var(--foot) + 28px + 41dvh + env(safe-area-inset-bottom)); touch-action: pan-y;
}
.sheet[data-lifted='true'] .sheet-scroll { padding-bottom: calc(var(--foot) + 28px + env(safe-area-inset-bottom)) }
.sheet-scroll::-webkit-scrollbar { width: 0 }

/* ---------- page furniture inside the sheet ---------- */
.wrap { padding: 0 20px }
.eyebrow { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink-soft) }
.eyebrow svg { width: 15px; height: 15px; flex-shrink: 0 }
.page-head { padding: 4px 20px 16px }
.page-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.9px; color: var(--ink-deep); margin: 7px 0 6px }
.page-head p { font-size: 15.5px; color: var(--ink-mid) }
.flow { display: flex; flex-direction: column; gap: 14px }
.small { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft) }
.card { position: relative; background: var(--paper); border-radius: 24px; box-shadow: var(--shadow-card); overflow: hidden }
.card-pad { padding: 18px 18px 20px }
.tint-card { border-radius: 22px; padding: 16px; box-shadow: var(--shadow-card) }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px }
.row-head h2 { font-size: 23px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.4px; display: flex; align-items: center; gap: 8px }
.squiggle { width: 46px; height: 10px; color: var(--leaf); opacity: .7; flex-shrink: 0 }
.pill-link {
 display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 8px 14px; border-radius: 99px;
 background: var(--paper); box-shadow: var(--shadow-soft);
 font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink);
 transition: transform .2s cubic-bezier(.22,.9,.28,1);
}
.pill-link:active { transform: scale(.95) }
.pill-link svg { width: 13px; height: 13px; stroke-width: 2.4 }
.text-link { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-soft) }
.text-link:hover { color: var(--ink) }
.text-link svg { width: 14px; height: 14px; stroke-width: 2.4 }
.note-strip { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft) }
.note-strip svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; color: var(--leaf) }
.fineprint { font-size: 12px; color: var(--ink-faint); text-align: center; line-height: 1.6 }

/* Every card in a list arrives a beat after the one above it. */
.stagger > * { animation: rise .5s cubic-bezier(.22,.9,.28,1) both; animation-delay: calc(var(--i, 0) * 55ms) }
@keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

/* ---------- controls ---------- */
.btn {
 display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px;
 border-radius: 16px; background: var(--ink); color: var(--on-ink);
 font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 15.5px;
 box-shadow: 0 10px 22px -14px rgb(19 73 44 / .95);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s, box-shadow .18s;
}
.btn:hover { background: #1A5E3B }
.btn:active { transform: translateY(1px) scale(.985) }
.btn:disabled { opacity: .42; box-shadow: none; transform: none }
.btn svg { width: 18px; height: 18px; stroke-width: 2 }
.btn-soft { background: var(--soft); color: var(--ink); box-shadow: none }
.btn-soft:hover { background: var(--soft-hover) }
.btn-quiet { background: transparent; color: var(--ink-soft); font-weight: 700; min-height: 44px; box-shadow: none }
.btn-quiet:hover { background: var(--wash); color: var(--ink) }
.btn-block { width: 100% }
.input, select.input, textarea.input {
 width: 100%; min-height: 48px; padding: 12px 15px; border-radius: 14px; background: var(--paper);
 border: 0; box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .14); font: inherit; font-size: 15px; color: var(--ink-deep);
 transition: box-shadow .18s;
}
.input::placeholder { color: var(--ink-faint) }
.input:focus-visible { outline: none; box-shadow: inset 0 0 0 2.5px var(--leaf) }
textarea.input { min-height: 92px; resize: none; line-height: 1.5 }
.label { display: block; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip-choice {
 padding: 9px 14px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .14);
 font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-soft);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s, color .18s, box-shadow .18s;
}
.chip-choice:hover { box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .3) }
.chip-choice:active { transform: scale(.95) }
.chip-choice[aria-pressed='true'], .chip-choice[aria-checked='true'] { background: var(--gold); color: #4A3A16; box-shadow: none }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px }
.switch-row b { display: block; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 15.5px; color: var(--ink-deep) }
.toggle { position: relative; width: 52px; height: 31px; border-radius: 99px; background: var(--track); flex-shrink: 0; transition: background .25s }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: var(--paper); box-shadow: 0 2px 6px -2px rgb(24 70 46 / .6); transition: transform .28s cubic-bezier(.3,1.4,.5,1) }
.toggle[aria-pressed='true'] { background: var(--leaf) }
.toggle[aria-pressed='true']::after { transform: translateX(21px) }

/* ---------- feelings ---------- */
.feelings { padding: 18px 18px 20px }
.feelings h2 { font-size: 30px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.7px; margin: 6px 0 3px }
.feelings > p { font-size: 15px; color: var(--ink-mid) }
.feelings-sprig { position: absolute; right: -6px; top: 6px; width: 96px; opacity: .95; pointer-events: none }
.mood { position: relative; height: 48px; margin-top: 14px; padding-inline: 24px; touch-action: none }
.mood-rail { position: absolute; left: 24px; right: 24px; top: 50%; height: 11px; margin-top: -5.5px; border-radius: 99px; background: var(--track) }
.mood-fill { position: absolute; left: 24px; right: 24px; top: 50%; height: 11px; margin-top: -5.5px; border-radius: 99px; background: linear-gradient(90deg, var(--leaf-bright), var(--leaf)); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform .42s cubic-bezier(.22, .9, .28, 1) }
/* The run is exactly the knob travel, so a percentage translate lands it on the mark. */
.mood-run { position: absolute; left: 24px; right: 24px; top: 50%; height: 0; transform: translateX(calc(var(--p, 0) * 100%)); transition: transform .42s cubic-bezier(.22, .9, .28, 1) }
.mood-knob { position: absolute; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--sprout); display: grid; place-items: center; box-shadow: 0 8px 16px -8px rgb(12 34 20 / .6); transition: transform .2s }
.mood[data-dragging='true'] .mood-run, .mood[data-dragging='true'] .mood-fill { transition: none }
.mood[data-dragging='true'] .mood-knob { transform: scale(1.08) }
.mood-knob svg { width: 22px; height: 22px; color: var(--ink) }
.mood-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-faint); margin-top: 4px; padding-inline: 2px }

/* ---------- people ---------- */
.people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px }
.person { position: relative; display: flex; flex-direction: column; padding: 13px 13px 12px; text-align: left; border-radius: 22px; box-shadow: var(--shadow-card); overflow: hidden; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.person:active { transform: scale(.985) }
.person-sprig { position: absolute; right: -4px; bottom: 4px; width: 58px; opacity: .8; pointer-events: none }
.person-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100% }
.person h3 { font-size: 16px; font-weight: 700; color: var(--ink-deep); margin: 9px 0 3px }
.person-note { font-size: 12.5px; line-height: 1.4; color: var(--ink-mid); min-height: 35px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; position: relative; z-index: 1 }
.person-foot { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11.5px; color: var(--ink-soft); position: relative; z-index: 1 }
.person-foot svg { width: 13px; height: 13px; flex-shrink: 0 }
.call-now {
 display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 44px; margin-top: 10px;
 border-radius: 14px; background: var(--float-soft); color: var(--ink);
 font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px; position: relative; z-index: 1;
 box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .16);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s;
}
.call-now:hover { background: #fff }
.call-now:active { transform: scale(.96) }
.call-now svg { width: 14px; height: 14px; stroke-width: 2 }
.unread { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }

/* ---------- avatars ---------- */
.avatar { display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; font-family: var(--font-round), sans-serif; font-weight: 700; color: #43543F; flex-shrink: 0 }
.avatar-gold { background: var(--av-gold) } .avatar-green { background: var(--av-mint) }
.avatar-orange { background: var(--av-rose) } .avatar-sky { background: var(--av-blue) }
.avatar-photo { width: 100%; height: 100%; object-fit: cover }
.avatar-xs { width: 26px; height: 26px; font-size: 11px }
.avatar-sm { width: 34px; height: 34px; font-size: 14px }
.avatar-md { width: 42px; height: 42px; font-size: 17px }
.avatar-lg { width: 56px; height: 56px; font-size: 22px }
.avatar-xl { width: 92px; height: 92px; font-size: 36px }
.tint-gold { background: var(--tint-yellow) } .tint-green { background: var(--tint-mint) }
.tint-orange { background: var(--tint-rose) } .tint-sky { background: var(--tint-blue) }

/* ---------- a little something ---------- */
.something { display: flex; align-items: flex-end; gap: 12px }
.notes-rail {
 display: flex; gap: 22px; overflow-x: auto; flex: 1; min-width: 0; padding: 56px 6px 6px 2px; scrollbar-width: none;
 -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
 mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
}
.notes-rail::-webkit-scrollbar { display: none }
.note-item { position: relative; flex: 0 0 auto; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.note-item:active { transform: scale(.95) }
.note-bubble {
 position: absolute; bottom: calc(100% - 2px); left: 50%; transform: translateX(-50%);
 width: 76px; max-height: 46px; padding: 6px 8px; border-radius: 13px 13px 13px 4px;
 background: var(--paper); box-shadow: var(--shadow-soft); font-size: 10px; line-height: 1.3; color: var(--ink-deep);
 text-align: left; overflow: hidden; z-index: 2;
}
.note-face { position: relative; width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--shadow-card); overflow: hidden }
.note-face svg { width: 23px; height: 23px; stroke-width: 1.9; color: #43543F }
.note-initial { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 22px; color: #43543F }
.note-name { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.note-dot { position: absolute; top: 4px; right: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }

/* ---------- small rows ---------- */
.row {
 display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 15px; border-radius: 20px;
 background: var(--paper); box-shadow: var(--shadow-card); text-align: left;
 transition: transform .2s cubic-bezier(.22,.9,.28,1);
}
.row:active { transform: scale(.985) }
.row-icon { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; background: var(--tint-mint) }
.row-icon svg { width: 18px; height: 18px; stroke-width: 1.9; color: #43543F }
.row-body { flex: 1; min-width: 0 }
.row-body b { display: block; font-family: var(--font-round), sans-serif; font-size: 14.5px; font-weight: 700; color: var(--ink-deep) }
.row-body span { display: block; font-size: 12.5px; color: var(--ink-soft) }
.caret { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-faint); stroke-width: 2.2 }
.empty { padding: 18px 16px; border-radius: 20px; background: var(--float-soft); font-size: 13.5px; color: var(--ink-soft); text-align: center }

/* ---------- the little-something tile row ---------- */

/* ---------- bottom nav ---------- */
.nav {
 position: absolute; z-index: 30; left: 50%; transform: translateX(-50%);
 bottom: calc(14px + env(safe-area-inset-bottom)); width: min(400px, calc(100% - 28px)); height: 66px;
 display: flex; align-items: center; justify-content: space-around; padding: 0 4px;
 border-radius: 26px; background: var(--float); box-shadow: 0 14px 30px -14px rgb(12 34 20 / .55);
 backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 60px; color: var(--ink-faint); transition: color .2s, transform .2s cubic-bezier(.22,.9,.28,1) }
.nav-item:active { transform: scale(.92) }
.nav-item svg { width: 21px; height: 21px; stroke-width: 1.9 }
.nav-item b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 11px }
.nav-item i { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-top: 1px }
.nav-item[aria-current='page'] { color: var(--ink) }
.nav-item[aria-current='page'] i { background: var(--ink) }
.nav-share { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; position: relative; top: -12px }
.nav-share-disc {
 position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
 background: var(--sprout); box-shadow: 0 8px 18px -10px rgb(12 34 20 / .7);
 transition: transform .24s cubic-bezier(.3,1.4,.5,1), background .24s;
}
.nav-share:active .nav-share-disc { transform: scale(.9) }
.nav-share-disc svg { width: 23px; height: 23px; stroke-width: 1.9; color: var(--ink-soft); transition: color .24s }
.nav-share[aria-pressed='true'] .nav-share-disc { background: linear-gradient(160deg, var(--leaf-bright), #4A8E58) }
.nav-share[aria-pressed='true'] .nav-share-disc svg { color: #FEFCF5 }
/* When sharing is on, the leaf gets a few quiet rays, the way the reference draws it. */
.nav-share[aria-pressed='true'] .nav-share-disc::before {
 content: ''; position: absolute; inset: -7px; border-radius: 50%;
 background: conic-gradient(from 0deg, transparent 0 12deg, rgb(242 199 92 / .9) 12deg 15deg, transparent 15deg 57deg, rgb(242 199 92 / .9) 57deg 60deg, transparent 60deg 102deg, rgb(242 199 92 / .9) 102deg 105deg, transparent 105deg 147deg, rgb(242 199 92 / .9) 147deg 150deg, transparent 150deg 192deg, rgb(242 199 92 / .9) 192deg 195deg, transparent 195deg 237deg, rgb(242 199 92 / .9) 237deg 240deg, transparent 240deg 282deg, rgb(242 199 92 / .9) 282deg 285deg, transparent 285deg 327deg, rgb(242 199 92 / .9) 327deg 330deg, transparent 330deg);
 -webkit-mask: radial-gradient(circle, transparent 0 26px, #000 27px); mask: radial-gradient(circle, transparent 0 26px, #000 27px);
 animation: rays 9s linear infinite;
}
@keyframes rays { to { transform: rotate(360deg) } }
.nav-share b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 10.5px; color: var(--ink-faint); white-space: nowrap }
.nav-share[aria-pressed='true'] b { color: var(--ink) }

/* ---------- the week ---------- */
.cal { padding: 12px 10px 10px }
.cal-week { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px }
.cal-week b { font-family: var(--font-round), sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-deep) }
.cal-step { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background .2s }
.cal-step:hover { background: var(--secondary) }
.cal-step svg { width: 18px; height: 18px; stroke-width: 2.2 }
.cal-head { display: grid; grid-template-columns: 30px repeat(7, 1fr); padding-bottom: 5px }
.cal-head span { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); text-align: center }
.cal-head span[data-today='true'] { color: var(--ink) }
.cal-head span i { display: block; font-style: normal; font-size: 10px; font-weight: 600; color: var(--ink-faint) }
.cal-body { display: grid; grid-template-columns: 30px 1fr; max-height: 340px; overflow-y: auto; overscroll-behavior: contain }
.cal-body::-webkit-scrollbar { width: 4px }
.cal-body::-webkit-scrollbar-thumb { background: #CFD8C9; border-radius: 99px }
.cal-hours { display: flex; flex-direction: column }
.cal-hour { height: 40px; line-height: 1; font-size: 10px; color: var(--ink-faint); text-align: right; padding: 1px 5px 0 0 }
.cal-grid { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); background: var(--float-soft); border-radius: 12px; overflow: hidden; touch-action: pan-y }
.cal-col { position: relative; border-left: 1px solid var(--hairline) }
.cal-col:first-child { border-left: 0 }
.cal-col[data-today='true'] { background: rgb(242 199 92 / .08) }
.cal-slot { height: 40px; border-top: 1px solid var(--hairline) }
.cal-slot:first-child { border-top: 0 }
.cal-block {
 position: absolute; left: 2px; right: 2px; border-radius: 10px; padding: 4px 5px; overflow: hidden; text-align: left;
 background: var(--ink); color: #FEFCF5; box-shadow: 0 4px 10px -6px rgb(19 73 44 / .9);
 animation: pop-block .32s cubic-bezier(.3,1.3,.5,1) both;
}
@keyframes pop-block { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: none } }
.cal-block b { display: block; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 9.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cal-block span { font-size: 8.5px; opacity: .8; white-space: nowrap }
.cal-block svg { position: absolute; right: 3px; bottom: 2px; width: 11px; height: 11px; opacity: .35 }
.cal-block[data-linked='true'] { background: var(--gold); color: #4A3A16; box-shadow: 0 4px 10px -6px rgb(190 150 40 / .8) }
.cal-draft { position: absolute; left: 2px; right: 2px; border-radius: 10px; background: rgb(89 164 104 / .34); box-shadow: inset 0 0 0 1.5px var(--leaf); pointer-events: none }
.cal-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 4px 0; font-size: 11.5px; color: var(--ink-soft) }
.cal-legend span { display: flex; align-items: center; gap: 6px }
.swatch { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0 }

/* ---------- scrapbook ---------- */
.scrap { columns: 2; column-gap: 11px; padding-top: 2px }
.polaroid {
 position: relative; break-inside: avoid; margin-bottom: 13px; padding: 8px 8px 12px; background: var(--paper);
 border-radius: 4px; box-shadow: 0 10px 22px -14px rgb(24 70 46 / .7); display: block; width: 100%; text-align: left;
 transition: transform .24s cubic-bezier(.22,.9,.28,1);
}
.polaroid:nth-child(3n) { transform: rotate(1.6deg) } .polaroid:nth-child(3n+1) { transform: rotate(-1.4deg) }
.polaroid:nth-child(4n) { transform: rotate(.8deg) }
.polaroid:hover { transform: rotate(0) scale(1.02); z-index: 2 }
.polaroid-tape { position: absolute; top: -8px; left: 50%; width: 52px; height: 18px; margin-left: -26px; border-radius: 2px; background: rgb(226 239 220 / .82); box-shadow: 0 1px 3px rgb(24 70 46 / .12); transform: rotate(-3deg) }
.polaroid:nth-child(even) .polaroid-tape { background: rgb(251 242 212 / .85); transform: rotate(4deg) }
.polaroid-shot { aspect-ratio: 1; border-radius: 2px; overflow: hidden; display: grid; place-items: center }
.polaroid-shot img { width: 100%; height: 100%; object-fit: cover }
.polaroid-date { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 7px }
.polaroid-note { display: block; font-family: var(--font-round), ui-rounded, sans-serif; font-size: 15px; line-height: 1.2; color: var(--ink-mid) }
.scrap-note { break-inside: avoid; margin-bottom: 13px; padding: 20px 16px; border-radius: 6px; border: 1.5px dashed rgb(31 107 67 / .3); background: rgb(226 239 220 / .35); font-family: var(--font-round), ui-rounded, sans-serif; font-size: 18px; line-height: 1.25; color: var(--ink-mid); text-align: center }
.fab {
 position: absolute; z-index: 25; right: 20px; bottom: calc(92px + env(safe-area-inset-bottom));
 width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
 background: linear-gradient(160deg, var(--leaf-bright), #4A8E58); color: #FEFCF5;
 box-shadow: 0 12px 24px -10px rgb(31 107 67 / .9); transition: transform .22s cubic-bezier(.3,1.4,.5,1);
}
.fab:active { transform: scale(.9) }
.fab svg { width: 24px; height: 24px; stroke-width: 2.2 }

/* ---------- share my load ---------- */
.who-row { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none }
.who-row::-webkit-scrollbar { display: none }
.who { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 58px; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.who:active { transform: scale(.93) }
.who-face { position: relative; border-radius: 50%; transition: box-shadow .2s }
.who[aria-pressed='true'] .who-face { box-shadow: 0 0 0 2.5px var(--leaf), 0 0 0 5px rgb(89 164 104 / .22) }
.who b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft) }
.who[aria-pressed='true'] b { color: var(--ink) }
.who-add { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--tint-blue); color: var(--ink) }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 15px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-card); text-align: left }
.pick-mark { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgb(31 107 67 / .28); transition: box-shadow .2s, background .2s }
.pick[aria-checked='true'] .pick-mark { background: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 5px var(--paper) }

/* ---------- overlays ---------- */
.scrim { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgb(24 52 38 / .5); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); animation: fade .24s ease both }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.panel { width: 100%; max-width: 340px; background: var(--paper); border-radius: 28px; padding: 16px 18px 14px; box-shadow: 0 30px 70px -34px rgb(12 30 20 / .9); animation: pop .38s cubic-bezier(.25,1.2,.35,1) both }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.94) } to { opacity: 1; transform: none } }
.vitrine { position: relative; height: 196px; border-radius: 22px; overflow: hidden; background: var(--case); box-shadow: inset 0 0 0 1px var(--glass), inset 0 -34px 38px -30px rgb(31 107 67 / .45) }
.vitrine::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(118deg, rgb(255 255 255 / .66) 0 20%, rgb(255 255 255 / .06) 40%, rgb(255 255 255 / 0) 56%) }
.vitrine-shadow { position: absolute; left: 50%; bottom: 24px; width: 112px; height: 14px; margin-left: -56px; border-radius: 50%; background: radial-gradient(ellipse, rgb(31 107 67 / .22), rgb(31 107 67 / 0) 70%) }
.vitrine-stage { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite }
@keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-2deg) } 50% { transform: translateX(-50%) rotate(2deg) } }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 13px 2px 2px }
.panel-head h3 { font-size: 22px; font-weight: 700; color: var(--ink-deep) }
.panel-who { font-size: 13px; color: var(--ink-soft) }
.panel-rows { display: flex; flex-direction: column; margin-top: 8px }
.panel-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 2px; border-bottom: 1px solid var(--hairline); font-size: 14px }
.panel-row:last-child { border-bottom: 0 }
.panel-row b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap }
.panel-row span { text-align: right; color: var(--ink-deep) }

.curtain { position: absolute; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: linear-gradient(172deg, #FBF5E9 0%, #F3E9D6 55%, #E7DCC7 100%); animation: fade .24s ease both }
.curtain-sheet { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 22px 0 }
.curtain-title { font-size: 30px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.7px; text-align: center }
.curtain-sub { font-size: 14.5px; color: var(--ink-soft); text-align: center; max-width: 290px }
.halo { position: relative; display: grid; place-items: center; padding: 8px; border-radius: 50%; background: var(--float); box-shadow: 0 16px 34px -20px rgb(12 34 20 / .8) }
.halo::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgb(89 164 104 / .35); animation: ping 2.4s ease-out infinite }
@keyframes ping { 0% { transform: scale(.96); opacity: .9 } 100% { transform: scale(1.18); opacity: 0 } }
.paths { display: flex; flex-direction: column; gap: 9px; width: 100% }
.path { display: grid; grid-template-columns: 42px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 13px 15px; border-radius: 19px; background: var(--paper); box-shadow: var(--shadow-card); text-align: left; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.path:active { transform: scale(.98) }
.path-icon { grid-row: 1 / 3; width: 42px; height: 42px; border-radius: 14px; background: #E4F0E2; display: grid; place-items: center }
.path-icon svg { width: 19px; height: 19px; stroke-width: 1.9; color: var(--ink) }
.path b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 15px; color: var(--ink-deep) }
.path span { font-size: 12px; color: var(--ink-soft) }
.timer { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 32px; color: var(--ink); font-variant-numeric: tabular-nums }
.bloom-stage { display: grid; place-items: end center; height: 180px }
.bloom-svg { width: 180px; height: 180px; overflow: visible }
.bloom-ground { fill: rgb(31 107 67 / .13) }
.flower-bloom .flower-petal { transform-box: fill-box; transform-origin: center; animation: petal .7s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i) * 38ms + 120ms) }
.flower-bloom .flower-heart { transform-box: fill-box; transform-origin: center; animation: petal .5s cubic-bezier(.2,.9,.3,1.2) both }
.flower-bloom .flower-stem, .flower-bloom .flower-leaf { animation: sprout .55s ease-out both }
@keyframes petal { from { transform: scale(.1); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes sprout { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.flower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; width: 100% }
.flower-option { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 11px 9px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .12); transition: transform .2s cubic-bezier(.22,.9,.28,1), box-shadow .2s }
.flower-option:active { transform: scale(.96) }
.flower-option[aria-checked='true'] { box-shadow: inset 0 0 0 2.5px var(--leaf); background: #F4FAF2 }
.flower-option b { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-deep) }
.flower-option span { font-size: 10.5px; color: var(--ink-soft); text-align: center; line-height: 1.35 }

/* ---------- instants viewer ---------- */
.story { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #10251A; animation: fade .22s ease both }
.story-bars { display: flex; gap: 4px; padding: calc(env(safe-area-inset-top) + 10px) 12px 0 }
.story-bar { flex: 1; height: 2.5px; border-radius: 99px; background: rgb(255 255 255 / .28); overflow: hidden }
.story-bar i { display: block; height: 100%; background: #FEFCF5; border-radius: 99px }
.story-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px }
.story-who { flex: 1; min-width: 0; color: #FEFCF5 }
.story-who b { display: block; font-family: var(--font-round), sans-serif; font-size: 14.5px; font-weight: 700 }
.story-who span { font-size: 12px; color: rgb(254 252 245 / .6) }
.story-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #FEFCF5; transition: background .2s }
.story-icon:hover { background: rgb(255 255 255 / .12) }
.story-icon:disabled { opacity: .4 }
.story-icon svg { width: 21px; height: 21px; stroke-width: 1.9 }
.story-stage { position: relative; flex: 1; display: grid; place-items: center; padding: 4px 16px 10px; min-height: 0 }
.story-frame { position: relative; width: 100%; max-width: 340px; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 30px 60px -30px #000 }
.story-photo { width: 100%; height: 100%; object-fit: cover }
.story-empty { width: 100%; height: 100% }
.story-caption { position: absolute; left: 18px; right: 18px; bottom: 26px; font-family: var(--font-round), ui-rounded, sans-serif; font-size: 21px; line-height: 1.2; color: #FEFCF5; text-align: center; text-shadow: 0 2px 12px rgb(16 37 26 / .8) }
.story-half { position: absolute; top: 0; bottom: 0; width: 34%; background: transparent }
.story-prev { left: 0 } .story-next { right: 0 }
.story-reply { display: flex; align-items: center; gap: 8px; padding: 0 14px calc(16px + env(safe-area-inset-bottom)) }
.story-input { flex: 1; min-width: 0; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1.5px solid rgb(255 255 255 / .35); background: transparent; color: #FEFCF5; font: inherit; font-size: 14px }
.story-input::placeholder { color: rgb(254 252 245 / .5) }
.story-input:focus-visible { outline: none; border-color: #FEFCF5 }

/* ---------- camera ---------- */
.camera { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #17281D; animation: fade .22s ease both }
.camera-bar { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 12px) 12px 4px; color: #FEFCF5 }
.camera-title { font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 15px }
.camera-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 6px 20px; min-height: 0 }
.camera-frame { position: relative; width: 100%; max-width: 330px; aspect-ratio: 3 / 4; border-radius: 26px; overflow: hidden; background: #24382A; display: grid; place-items: center }
.camera-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1) }
img.camera-feed { transform: none }
.camera-corners { position: absolute; inset: 10px; border-radius: 20px; pointer-events: none; background:
 linear-gradient(#FEFCF5, #FEFCF5) 0 0 / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 0 0 / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 100% 0 / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 100% 0 / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 0 100% / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 0 100% / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 100% 100% / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 100% 100% / 2px 26px no-repeat;
 opacity: .8;
}
.camera-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; height: 100%; padding: 24px; text-align: center; color: #FEFCF5 }
.camera-fallback svg { width: 28px; height: 28px }
.camera-fallback b { font-family: var(--font-round), sans-serif; font-size: 17px }
.camera-fallback span { font-size: 13px; color: rgb(254 252 245 / .7) }
.camera-caption { width: 100%; max-width: 330px; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1.5px solid rgb(255 255 255 / .35); background: transparent; color: #FEFCF5; font-family: var(--font-round), ui-rounded, sans-serif; font-size: 18px; text-align: center }
.camera-caption::placeholder { color: rgb(254 252 245 / .5) }
.camera-deck { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 8px 20px 6px }
.camera-side { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .14); color: #FEFCF5 }
.camera-side svg { width: 20px; height: 20px; stroke-width: 1.9 }
.camera-shutter { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; background: rgb(255 255 255 / .2); transition: transform .18s cubic-bezier(.22,.9,.28,1) }
.camera-shutter:active { transform: scale(.9) }
.camera-shutter span { width: 60px; height: 60px; border-radius: 50%; background: #FEFCF5; box-shadow: inset 0 0 0 2px #17281D, inset 0 0 0 4px #FEFCF5 }
.camera-send { min-width: 180px }
.camera-audience { align-self: center; display: inline-flex; align-items: center; gap: 6px; margin-bottom: calc(16px + env(safe-area-inset-bottom)); padding: 9px 16px; border-radius: 99px; background: rgb(255 255 255 / .16); color: #FEFCF5; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px }
.camera-audience svg { width: 14px; height: 14px; stroke-width: 2.2 }

/* ---------- shared primitives ---------- */

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }

/* ---------- the garden, listed ---------- */
.sections-panel { max-height: 82dvh; overflow-y: auto }
.sections-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px }
.sections-list .row { text-align: left }
.entrance { animation: rise .45s cubic-bezier(.22,.9,.28,1) both }
[data-reduced-motion='true'] *, [data-reduced-motion='true'] *::before, [data-reduced-motion='true'] *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important } }

/* ---------- loading ---------- */
.skeleton { border-radius: 22px; background: linear-gradient(100deg, #F1EADB 30%, #F8F2E6 48%, #F1EADB 66%); background-size: 300% 100%; animation: shimmer 1.5s ease-in-out infinite }
@keyframes shimmer { from { background-position: 140% 0 } to { background-position: -40% 0 } }

/* ---------- the segmented control ---------- */
.segment { position: relative; display: flex; padding: 5px; margin-bottom: 13px; border-radius: 99px; background: var(--paper); box-shadow: var(--shadow-card) }
.segment-slide {
 position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 99px;
 background: linear-gradient(160deg, #F8D583, var(--gold)); box-shadow: 0 6px 14px -8px rgb(190 150 40 / .9);
 transform: translateX(calc(var(--i, 0) * 100%));
 transition: transform .46s cubic-bezier(.34, 1.36, .5, 1);
}
.segment-tab {
 position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
 min-height: 40px; border-radius: 99px; font-family: var(--font-round), sans-serif; font-weight: 700; font-size: 13px;
 color: var(--ink-soft); transition: color .28s, transform .2s cubic-bezier(.22, .9, .28, 1);
}
.segment-tab svg { width: 15px; height: 15px; stroke-width: 2; transition: transform .36s cubic-bezier(.34, 1.36, .5, 1) }
.segment-tab:active { transform: scale(.95) }
.segment-tab[aria-selected='true'] { color: #4A3A16 }
.segment-tab[aria-selected='true'] svg { transform: scale(1.12) rotate(-6deg) }

/* ---------- the verge: the flowers at the foot of every screen ----------
   In front of the card and behind the nav, so wherever you are in the app you are
   standing in the same meadow. Each clump keeps its own clock, which is what stops
   the row reading as one shape rocking. */
.verge {
 position: absolute; z-index: 22; left: 0; right: 0; bottom: 0; height: var(--foot);
 pointer-events: none;
}
.verge svg { width: 100%; height: 100%; display: block; filter: brightness(var(--verge-light, 1)) saturate(var(--verge-sat, 1)) }
.verge-sway { transform-box: fill-box; transform-origin: 50% 100%; animation: verge 7s ease-in-out infinite }
.verge-b { animation-duration: 9.4s; animation-delay: -2.6s }
.verge-c { animation-duration: 11.8s; animation-delay: -5.1s; animation-direction: alternate-reverse }
.verge-d { animation-duration: 8.2s; animation-delay: -1.3s; animation-direction: alternate-reverse }
@keyframes verge {
 0%, 100% { transform: rotate(-1.4deg) translateY(0) }
 50% { transform: rotate(1.4deg) translateY(-1.5px) }
}

/* ---------- the weather turns over ---------- */
.weather-turn { display: grid; place-items: center; width: 22px; height: 22px; perspective: 90px }
.weather-turn > * { grid-area: 1 / 1; transform-origin: center; animation: turn-over .72s cubic-bezier(.32, 1.24, .4, 1) both }
@keyframes turn-over {
 0% { opacity: 0; transform: rotate(-170deg) scale(.25) }
 55% { opacity: 1; transform: rotate(14deg) scale(1.14) }
 100% { opacity: 1; transform: none }
}
.chip-text { display: inline-block; animation: chip-in .5s cubic-bezier(.22, .9, .28, 1) both }
@keyframes chip-in { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* ---------- the camera stands in the meadow ---------- */
.camera { background: linear-gradient(180deg, rgb(18 40 27 / .58) 0%, rgb(18 40 27 / .74) 58%, rgb(14 32 21 / .88) 100%); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px) }
.camera-frame { background: rgb(20 42 29 / .35); box-shadow: 0 30px 60px -30px rgb(9 24 16 / .9), inset 0 0 0 1px rgb(255 253 248 / .16) }

/* ---------- the window opens ---------- */
.window-card { position: relative; width: 100%; max-width: 330px; padding: 26px 22px 22px; border-radius: 30px; background: var(--paper); box-shadow: 0 30px 70px -30px rgb(12 30 20 / .8); text-align: center; overflow: hidden; animation: pop .5s cubic-bezier(.26, 1.3, .36, 1) both }
.window-card::before { content: ''; position: absolute; inset: -40% -20% auto; height: 150px; background: radial-gradient(ellipse at 50% 0, rgb(242 199 92 / .4), rgb(242 199 92 / 0) 70%); pointer-events: none }
.window-bloom { position: relative; display: grid; place-items: center; width: 104px; height: 104px; margin: 0 auto 4px; border-radius: 50%; background: radial-gradient(circle, #FBF0D4, #F3E7CE) }
.window-bloom svg { width: 58px; height: 58px; animation: bloom-open .9s cubic-bezier(.24, 1.3, .36, 1) both .1s }
@keyframes bloom-open { from { opacity: 0; transform: scale(.2) rotate(-40deg) } to { opacity: 1; transform: none } }
.window-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgb(242 199 92 / .55); animation: ping 2.6s ease-out infinite }
.window-ring:nth-of-type(2) { animation-delay: .9s }

/* ---------- motion that earns its place ---------- */
/* An unread mark breathes; it is the one thing on the card asking for you. */
.unread, .disc i { animation: breathe 2.6s ease-in-out infinite }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.22); opacity: .82 } }

/* The flower on a person's card leans, the way its cousins in the field do. */
.person-foot svg { transform-box: fill-box; transform-origin: 50% 100%; animation: lean 5.5s ease-in-out infinite }
.person:nth-of-type(2n) .person-foot svg { animation-duration: 6.8s; animation-direction: reverse }
@keyframes lean { 0%, 100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }

/* The sprig in a card corner drifts, slower than the field so it reads as nearer. */
.person-sprig, .feelings-sprig { transform-box: fill-box; transform-origin: 50% 100%; animation: lean 8s ease-in-out infinite }
.feelings-sprig { animation-duration: 9.5s }

/* A nav icon lands with a bounce when it becomes the page you are on. */
.nav-item svg { transition: transform .38s cubic-bezier(.34, 1.5, .5, 1) }
.nav-item[aria-current='page'] svg { transform: translateY(-2px) scale(1.1) }
.nav-item i { transition: transform .3s cubic-bezier(.34, 1.5, .5, 1), background .2s; transform: scale(0) }
.nav-item[aria-current='page'] i { transform: scale(1) }

/* The toggle knob overshoots and the track floods from the side it was pressed. */
.toggle::before { content: ''; position: absolute; inset: 0; border-radius: 99px; background: var(--leaf); transform: scaleX(0); transform-origin: left center; transition: transform .32s cubic-bezier(.4, 1.1, .5, 1) }
.toggle[aria-pressed='true']::before { transform: scaleX(1) }
.toggle::after { z-index: 1 }
.toggle:active::after { width: 30px }

/* Each screen arrives rather than appearing. */
.sheet-scroll > .entrance { animation: page-in .42s cubic-bezier(.22, .9, .28, 1) both }
@keyframes page-in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

/* The meadow chip settles in when the app opens. */
.meadow-chip { animation: chip-arrive .7s cubic-bezier(.26, 1.24, .36, 1) both .3s }
@keyframes chip-arrive { from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.9) } }

/* A pressed row sinks a hair, then comes back. */
.row:active, .path:active, .polaroid:active, .person-card:active { transform: scale(.982) translateY(1px) }

/* With the camera open the app steps out of the way, so what you are standing in
   is the meadow itself rather than a photograph of a card. */
.stage[data-camera='true'] .sheet,
.stage[data-camera='true'] .nav,
.stage[data-camera='true'] .topbar,
.stage[data-camera='true'] .verge,
.stage[data-camera='true'] .meadow-zoom,
.stage[data-camera='true'] .meadow-chip { opacity: 0; pointer-events: none; transition: opacity .34s ease }
.stage[data-camera='true'] .meadow-canvas { pointer-events: none }
.camera { background: linear-gradient(180deg, rgb(16 38 25 / .42) 0%, rgb(16 38 25 / .56) 55%, rgb(12 30 20 / .78) 100%) }

/* ---------- swapping one panel, not the page ----------
   The new view slides in from the side its tab sits on, so the row of tabs reads as
   a row of places rather than three buttons that reload the card. */
.panel-swap { animation: panel-in .42s cubic-bezier(.22, .92, .28, 1) both }
@keyframes panel-in {
 from { opacity: 0; transform: translate3d(calc(var(--from, 0) * 26px), 4px, 0) scale(.985) }
}
.panel-swap > .flow > .row { animation: panel-row .46s cubic-bezier(.22, .92, .28, 1) both; animation-delay: calc(var(--i, 0) * 42ms + 60ms) }
@keyframes panel-row { from { opacity: 0; transform: translate3d(0, 10px, 0) } }

/* ================================================================
   Motion, second pass.
   Two rules: anything that is a flower is alive, and nothing arrives by
   appearing. Everything below runs on transform and opacity only, so it all
   stays on the compositor no matter how much of it is on screen at once.
   ================================================================ */
:root {
 --ease-out: cubic-bezier(.22, .92, .28, 1);
 --ease-spring: cubic-bezier(.34, 1.42, .5, 1);
 --ease-soft: cubic-bezier(.4, 0, .2, 1);
}

/* ---------- every flower breathes ----------
   A flower that never moves is a sticker. These turn on their stem the way the
   painted ones in the field do, each on its own clock so a row of them never
   pulses as one. */
.flower { transform-box: fill-box; transform-origin: 50% 100%; animation: flower-breathe 6.5s var(--ease-soft) infinite }
.flower-petal { transform-box: fill-box; transform-origin: 50% 100% }
@keyframes flower-breathe {
 0%, 100% { transform: rotate(-2.6deg) scaleY(1) }
 50% { transform: rotate(2.6deg) scaleY(1.025) }
}
/* Seven phases off one nth-child chain: enough that no two neighbours agree. */
.flower-grid > *:nth-child(7n+2) .flower, .people-grid > *:nth-child(2n) .flower,
.row:nth-of-type(2n) .flower { animation-duration: 7.8s; animation-direction: reverse }
.flower-grid > *:nth-child(7n+4) .flower, .row:nth-of-type(3n) .flower { animation-duration: 5.4s; animation-delay: -1.9s }
.flower-grid > *:nth-child(7n+6) .flower { animation-duration: 8.6s; animation-delay: -3.4s }

/* ---------- a flower opens rather than appearing ----------
   Petals unfold outward from the heart, in order, once. Used wherever a flower is
   the point of what just happened: a call logged, a case opened, a window offered. */
.flower-bloom .flower-petal { animation: petal-open .72s var(--ease-spring) both; animation-delay: calc(var(--i, 0) * 52ms + 120ms) }
.flower-bloom .flower-heart { animation: heart-open .5s var(--ease-spring) both .1s }
.flower-bloom .flower-stem { animation: stem-grow .5s var(--ease-out) both }
.flower-bloom .flower-leaf { animation: leaf-open .5s var(--ease-spring) both .24s }
.flower-bloom .flower-leaf-right { animation-delay: .34s }
@keyframes petal-open { from { transform: scale(.1) rotate(-26deg); opacity: 0 } }
@keyframes heart-open { from { transform: scale(0) } }
@keyframes stem-grow { from { transform: scaleY(0) } }
@keyframes leaf-open { from { transform: scale(.2) } }

/* ---------- sprigs drift on two axes ----------
   One axis reads as a hinge; two reads as a plant in air. */
.person-sprig, .feelings-sprig { animation: sprig-drift 8s var(--ease-soft) infinite }
.feelings-sprig { animation-duration: 9.8s; animation-delay: -2.4s }
.person:nth-of-type(2n) .person-sprig { animation-duration: 10.6s; animation-direction: alternate-reverse }
.person:nth-of-type(3n) .person-sprig { animation-duration: 7.2s; animation-delay: -3.1s }
@keyframes sprig-drift {
 0%, 100% { transform: rotate(-3deg) translate3d(-1px, 0, 0) }
 50% { transform: rotate(3deg) translate3d(1px, -2px, 0) }
}
/* Press the card and its sprig startles, then settles. */
.person:active .person-sprig { animation: sprig-startle .6s var(--ease-spring) }
@keyframes sprig-startle { 0% { transform: rotate(-3deg) } 35% { transform: rotate(9deg) scale(1.06) } 100% { transform: rotate(-3deg) } }

/* ---------- the verge feels you go past ----------
   Scrolling the card brushes the flowers at the foot of the screen. The sheet writes
   how hard and which way; the strip leans and stands back up on its own. */
.verge svg { transform-origin: 50% 100%; transform: skewX(calc(var(--brush, 0) * -5deg)); transition: transform .62s var(--ease-out) }
.stage[data-dragging='true'] .verge svg { transition: transform .16s linear }

/* ---------- rows, cards and links ---------- */
.row, .path, .polaroid, .person, .note-item, .pill-link, .text-link, .call-now {
 transition: transform .26s var(--ease-spring), box-shadow .26s var(--ease-out), background .2s;
}
.row:active, .path:active, .polaroid:active { transform: scale(.975) translateY(1px) }
.person:active { transform: scale(.978) }
.call-now:active { transform: scale(.96) }
.pill-link:active, .text-link:active { transform: scale(.94) }
.pill-link svg, .text-link svg, .row .caret { transition: transform .3s var(--ease-spring) }
.pill-link:active svg, .text-link:active svg { transform: translateX(3px) }
.row:active .caret { transform: translateX(3px) }

/* ---------- the share leaf ripples when it is on ---------- */
.nav-share[aria-pressed='true'] .nav-share-disc::after {
 content: ''; position: absolute; inset: 0; border-radius: 50%;
 border: 2px solid var(--leaf); animation: ripple 2.8s var(--ease-out) infinite;
}
@keyframes ripple { 0% { transform: scale(1); opacity: .5 } 70%, 100% { transform: scale(1.55); opacity: 0 } }

/* ---------- the mood knob ---------- */
.mood-knob { transition: transform .26s var(--ease-spring), box-shadow .26s var(--ease-out) }
.mood[data-dragging='true'] .mood-knob { transform: scale(1.14) }
.mood-knob svg { transform-box: fill-box; transform-origin: 50% 100%; animation: lean 6.2s var(--ease-soft) infinite }

/* ---------- the brand's own sprout ---------- */
.brand > svg { transform-box: fill-box; transform-origin: 50% 100%; animation: sprig-drift 9.2s var(--ease-soft) infinite }

/* ---------- softer arrivals everywhere ---------- */
.sheet-scroll > .entrance { animation-duration: .5s; animation-timing-function: var(--ease-out) }
.stagger > * { animation: settle .58s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 58ms) }
@keyframes settle { from { opacity: 0; transform: translate3d(0, 16px, 0) scale(.985) } }

@media (prefers-reduced-motion: reduce) {
 *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important }
}
.stage[data-reduced-motion='true'] *, .stage[data-reduced-motion='true'] *::before, .stage[data-reduced-motion='true'] *::after {
 animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important;
}

/* ---------- the calling-vitality flower ----------
   Alive stages breathe a little; wilted ones mostly don't, which is itself the
   point, stillness reads as neglect without a word of copy needed. */
.growth-bud, .growth-blooming, .growth-full {
 transform-box: fill-box; transform-origin: 50% 100%;
 animation: growth-breathe 5.2s var(--ease-soft, ease-in-out) infinite;
}
.growth-blooming { animation-duration: 6.4s }
.growth-full { animation-duration: 4.6s }

<script>
(function(){
const flowerLibrary = [
    { id: 'daisy', name: 'Daisy', note: 'An ordinary, easy call.', petal: '#FFFFFF', petalDeep: '#F0F3E6', heart: '#F7C948', petals: 9, shape: 'round' },
    { id: 'marigold', name: 'Marigold', note: 'Warm, a little loud, full of news.', petal: '#F9C46A', petalDeep: '#EDA63F', heart: '#9A6526', petals: 11, shape: 'round' },
    { id: 'cosmos', name: 'Cosmos', note: 'Light and drifting. No agenda.', petal: '#F7C3D8', petalDeep: '#E9A0BF', heart: '#F7C948', petals: 7, shape: 'round' },
    { id: 'poppy', name: 'Poppy', note: 'Something honest got said.', petal: '#F08C79', petalDeep: '#DC6C58', heart: '#5E3F33', petals: 5, shape: 'cup' },
    { id: 'tulip', name: 'Tulip', note: 'Short, and enough.', petal: '#F3A0B6', petalDeep: '#DE7F99', heart: '#DE7F99', petals: 4, shape: 'cup' },
    { id: 'bluebell', name: 'Bluebell', note: 'Quiet. Mostly listening.', petal: '#A9C4EC', petalDeep: '#88A6DA', heart: '#6E86BE', petals: 5, shape: 'point' },
    { id: 'aster', name: 'Aster', note: 'Tangled, then untangled.', petal: '#C9AEE9', petalDeep: '#AC8CD6', heart: '#F7C948', petals: 13, shape: 'point' },
    { id: 'sunflower', name: 'Sunflower', note: 'The long, good kind.', petal: '#F7D35E', petalDeep: '#E2B733', heart: '#8A6230', petals: 14, shape: 'point' },
];
function flowerSpec(kind) { return flowerLibrary.find(f => f.id === kind) ?? flowerLibrary[0]; }
/* The land itself.

   Two readings of one world. Pull back and the lens flattens: you are looking
   straight down at a plan, every person's patch laid out like plots on a map.
   Push in and it tilts up into the landscape, and the ground stops being a plane,
   because the height field was under it the whole time. Nothing is swapped out
   between the two; `tilt` just moves from 0 to 1 and the same points land
   somewhere else.

   Everything here is deterministic off one seed, so the meadow you learn is the
   meadow you come back to. */
const SEED = 20260911;
/* ---------- noise ---------- */
function hash2(xi, yi, seed) {
    let h = seed ^ Math.imul(xi, 374761393) ^ Math.imul(yi, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function noise(x, y, seed) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi, seed), b = hash2(xi + 1, yi, seed);
    const c = hash2(xi, yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
    return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, y, seed, oct = 4) {
    let sum = 0, amp = 1, freq = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
        sum += noise(x * freq, y * freq, seed + i * 101) * amp;
        norm += amp;
        amp *= 0.5;
        freq *= 2;
    }
    return sum / norm;
}
const clamp01 = (n) => n < 0 ? 0 : n > 1 ? 1 : n;
const smooth = (n) => { const t = clamp01(n); return t * t * (3 - 2 * t); };
/* ---------- the shape of the ground ---------- */
const CELL = 15, COLS = 150, ROWS = 112;
const FIELD_W = COLS * CELL, FIELD_H = ROWS * CELL;
const N = 1250;
/** A stream finds the low ground on the left, and everything drains toward it. */
const riverAt = (wy) => FIELD_W * 0.12 + fbm(wy / 900 * 1.7, 3.2, SEED + 505, 3) * FIELD_W * 0.26;
function landAt(wx, wy) {
    const dx = (wx - FIELD_W / 2) / (FIELD_W * 0.52), dy = (wy - FIELD_H / 2) / (FIELD_H * 0.52);
    return (1 - Math.sqrt(dx * dx + dy * dy)) * 0.72 + fbm(wx / N * 1.9 + 41, wy / N * 1.9 + 41, SEED + 2200, 4) * 0.5 - 0.16;
}
/** The bump under everything. Ridged folds plus a rise toward the back, cut by the stream. */
function heightAt(wx, wy) {
    const base = fbm(wx / N * 2.1, wy / N * 2.1, SEED, 5);
    const folds = fbm(wx / N * 1.3 + 9, wy / N * 1.3 + 9, SEED + 77, 4);
    const ridge = 1 - Math.abs(folds * 2 - 1);
    let h = base * 0.42 + ridge * ridge * 0.3 + smooth(1 - wy / (FIELD_H * 0.58)) * 0.5;
    h *= 0.46 + 0.54 * smooth(wx / FIELD_W * 1.9);
    const bank = Math.abs(wx - riverAt(wy));
    if (bank < 58)
        h = Math.min(h, 0.2 + bank / 58 * 0.16);
    return clamp01(h);
}
const moistureAt = (wx, wy) => fbm(wx / N * 3.3 + 21, wy / N * 3.3 + 21, SEED + 311, 4);
const grovesAt = (wx, wy) => fbm(wx / N * 9.5 + 4, wy / N * 9.5 + 4, SEED + 907, 3);
const meadowAt = (wx, wy) => fbm(wx / N * 6.2 + 71, wy / N * 6.2 + 71, SEED + 1601, 3);
/* ---------- the lens ----------
   One projection with a dial on it. At tilt 0 it is an orthographic plan; at tilt 1
   a camera standing in the field looking out. In between it is the honest average of
   the two, which is what makes the change of view read as the ground tipping up
   rather than as a cut between two pictures. */
const TILT_FROM = 2.2, TILT_TO = 4.6, MAX_REL = 26;
const EYE = 300, SET_BACK = 2.4, ELEVATION = 168;
const HORIZON = 0.3;
const overviewZoom = (w, band) => (!w || !band) ? 0.2 : Math.min(w / FIELD_W, band / FIELD_H) * 0.96;
const clampZoom = (z, base) => Math.min(base * MAX_REL, Math.max(base, z));
const tiltFor = (zoom, base) => smooth((zoom / base - TILT_FROM) / (TILT_TO - TILT_FROM));
function buildLens(cam, view) {
    const rel = Math.max(cam.zoom / view.base, 0.6);
    const eye = Math.max(34, EYE * TILT_TO / rel);
    return {
        tilt: tiltFor(cam.zoom, view.base),
        focal: view.h * 0.92, eye, back: eye * SET_BACK,
        camZ: heightAt(cam.x, cam.y) * ELEVATION,
        cam, view,
    };
}
function project(lens, wx, wy, wz, out) {
    const { cam, view } = lens;
    const flatX = view.w / 2 + (wx - cam.x) * cam.zoom;
    const flatY = view.band * 0.5 + (wy - cam.y) * cam.zoom;
    if (lens.tilt <= 0.002) {
        out.x = flatX;
        out.y = flatY;
        out.s = cam.zoom;
        return out;
    }
    const d = Math.max(lens.eye * 0.3, cam.y + lens.back - wy);
    const tx = view.w / 2 + lens.focal * (wx - cam.x) / d;
    const ty = view.h * HORIZON + lens.focal * (lens.eye + lens.camZ - wz * ELEVATION) / d;
    const ts = lens.focal / d;
    out.x = flatX + (tx - flatX) * lens.tilt;
    out.y = flatY + (ty - flatY) * lens.tilt;
    out.s = cam.zoom + (ts - cam.zoom) * lens.tilt;
    return out;
}
function buildCells() {
    const out = [];
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            const x = col * CELL + (hash2(col, row, SEED + 5) - 0.5) * CELL * 0.6;
            const y = row * CELL + (hash2(col, row, SEED + 6) - 0.5) * CELL * 0.6;
            if (landAt(x, y) < 0.2)
                continue;
            const z = heightAt(x, y);
            const m = moistureAt(x, y), grove = grovesAt(x, y), meadow = meadowAt(x, y);
            const chance = hash2(col, row, SEED + 7);
            const roll = hash2(col, row, SEED + 8);
            let kind = 'grass', size = 0.5, tone = 1, tall = 0.6;
            if (z < 0.3) {
                kind = 'water';
                size = 0.9 + (0.3 - z) * 2;
                tone = 0;
                tall = 0.2;

function paintPlots(ctx, lens, plots, tintOf, alpha) {

    ctx.save();
    ctx.globalAlpha = alpha;
    for (const plot of plots) {
        ctx.beginPath();
        plot.ring.forEach(([rx, ry], i) => {
            project(lens, rx, ry, heightAt(rx, ry), dot);
            if (i === 0)
                ctx.moveTo(dot.x, dot.y);
            else
                ctx.lineTo(dot.x, dot.y);
        });
        ctx.closePath();
        ctx.fillStyle = tintOf(plot.id);
        ctx.globalAlpha = alpha * 0.26;
        ctx.fill();
        ctx.globalAlpha = alpha * 0.8;
        ctx.setLineDash([6, 5]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = tintOf(plot.id);
        ctx.stroke();
        ctx.setLineDash([]);

    const bend = gust * stem * 0.34;
    const hx = x + bend, hy = y - stem;
    if (s > 2) {
        ctx.strokeStyle = '#5F9457';
        ctx.lineWidth = Math.max(1, s * 0.17);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + bend * 0.3, y - stem * 0.55, hx, hy);
        ctx.stroke();
        ctx.fillStyle = '#6FA765';
        ctx.beginPath();
        ctx.ellipse(x + bend * 0.28 - s * 0.42, y - stem * 0.5, s * 0.44, s * 0.2, -0.5, 0, 6.283185);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(hx, hy, Math.max(s * 0.6, 1.3), 0, 6.283185);
        ctx.fill();

    for (let i = 0; i < f.petals; i++) {
        const a = (i / f.petals) * 6.283185 + spin + gust * 0.12;
        ctx.fillStyle = i % 2 ? f.petal : f.petalDeep;

        ctx.ellipse(hx + Math.cos(a) * s * 0.5, hy + Math.sin(a) * s * 0.5, s * 0.4, s * 0.29, a, 0, 6.283185);

function paintWeather(ctx, view, weather, t, tilt, sun) {
    const { w, h } = view;
    if (weather === 'clear' || weather === 'bright') {
        /* The shaft has to come from where the sun disc actually sits on the wheel, or
           it reads as two suns that don't agree with each other. */
        const sx = sun?.x ?? w * 0.6, sy = sun?.y ?? h * 0.12;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.rect(0, 0, w, h * HORIZON);
        ctx.clip();
        for (let i = 0; i < 2; i++) {
            const a = 2.05 + i * 0.5 + Math.sin(t * 0.00016 + i * 2) * 0.07;
            const grad = ctx.createLinearGradient(sx, sy, sx + Math.cos(a) * 320, sy + Math.sin(a) * 320);
            grad.addColorStop(0, `rgba(255,242,206,${(0.06 * (0.3 + tilt * 0.7)).toFixed(3)})`);
            grad.addColorStop(1, 'rgba(255,242,206,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx + Math.cos(a - 0.16) * 380, sy + Math.sin(a - 0.16) * 380);
            ctx.lineTo(sx + Math.cos(a + 0.16) * 380, sy + Math.sin(a + 0.16) * 380);
            ctx.closePath();
            ctx.fill();
        }
        ctx.restore();
        return;
    }
    if (weather === 'cloudy') {
        ctx.save();
        ctx.fillStyle = 'rgba(226,232,230,.18)';
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
        return;
    }
    const heavy = weather === 'storm';
    const drops = heavy ? 150 : 84;
    ctx.save();
    ctx.strokeStyle = heavy ? 'rgba(226,238,244,.55)' : 'rgba(226,238,244,.42)';
    ctx.lineWidth = heavy ? 1.5 : 1.1;
    ctx.lineCap = 'round';
    for (let i = 0; i < drops; i++) {
        const speed = heavy ? 1.35 : 0.85;
        const len = (heavy ? 26 : 17) * (0.6 + hash(i, 4100) * 0.9);
        const x = (hash(i, 4200) * (w + 120) + t * 0.035 * (heavy ? 1.6 : 1)) % (w + 120) - 60;
        const y = (hash(i, 4300) * h + t * speed * 0.42) % (h + 60) - 30;
        ctx.globalAlpha = 0.35 + hash(i, 4400) * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - len * 0.22, y + len);
        ctx.stroke();
    }
    ctx.restore();
    if (heavy) {
        const beat = Math.sin(t * 0.00052) * Math.sin(t * 0.00017);
        if (beat > 0.986) {
            ctx.save();
            ctx.fillStyle = `rgba(255,255,255,${((beat - 0.986) / 0.014 * 0.3).toFixed(3)})`;
            ctx.fillRect(0, 0, w, h);
            ctx.restore();

function paintShadows(ctx, view, weather, t, tilt) {

    if (flat < 0.02)
        return;
    const p = PALETTES[weather];
    ctx.save();
    ctx.globalAlpha = flat * (1 - p.light) * 1.6 + flat * 0.1;
    ctx.fillStyle = 'rgba(58,86,64,.5)';
    for (let i = 0; i < p.cloudCount; i++) {
        const s = 70 + hash(i, 909) * 90;
        const x = ((hash(i, 919) * (view.w + 420) + t * 0.012 * (1 + hash(i, 929))) % (view.w + 420)) - 210;
        const y = ((hash(i, 939) * (view.h + 300) + t * 0.005) % (view.h + 300)) - 150;
        ctx.beginPath();
        ctx.ellipse(x, y, s, s * 0.62, hash(i, 949) * 3, 0, 6.283185);
