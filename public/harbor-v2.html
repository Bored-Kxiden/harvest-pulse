<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#9ECDE8"/>
<title>Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--body:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--round:'Quicksand',ui-rounded,'Nunito',sans-serif;--script:'Caveat',cursive}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
/* ================================================================
   Harbor — the meadow is the app.
   A painted landscape holds the top of the screen; everything you do
   rides in a warm ivory sheet pulled up over its waist. Green carries
   meaning, gold carries the thing you last chose, and every surface is
   paper — soft shoulders, tinted shadows, no hard black anywhere.
   ================================================================ */
:root {
 color-scheme: light;
 --ivory: #FAF5EA;
 --ivory-deep: #F3EBDA;
 --paper: #FEFCF5;
 --ink: #1F6B43;
 --ink-deep: #13492C;
 --ink-mid: #4C6B52;
 --ink-soft: #7C8C7E;
 --ink-faint: #A6B0A4;
 --gold: #F2C75C;
 --gold-soft: #FBEECB;
 --leaf: #59A468;
 --leaf-bright: #79BC7F;
 --blush: #EE9A4D;
 --rose: #D98A86;

 --tint-yellow: #FBF2D4;
 --tint-mint: #E2EFDC;
 --tint-rose: #FBE5E3;
 --tint-lilac: #ECE7F8;
 --tint-blue: #E1EDF8;
 --tint-peach: #FCE2D0;
 --av-gold: #F7D179; --av-mint: #BCDDC0; --av-rose: #F6B8B4; --av-blue: #A9C9EE;

 --shadow-soft: 0 10px 30px -20px rgb(31 107 67 / .55);
 --shadow-card: 0 14px 34px -26px rgb(31 107 67 / .7);
 --shadow-lift: 0 -14px 44px -20px rgb(24 70 46 / .3);
 --hairline: rgb(31 107 67 / .09);

 --background: var(--ivory);
 --foreground: var(--ink-deep);
 --primary: var(--ink);
 --primary-foreground: #FEFCF5;
 --card: var(--paper);
 --card-foreground: var(--ink-deep);
 --popover: var(--paper);
 --popover-foreground: var(--ink-deep);
 --secondary: #E4F0E2;
 --secondary-foreground: var(--ink);
 --muted: #F1E9D8;
 --muted-foreground: #6F8272;
 --accent: var(--gold);
 --accent-foreground: #4A3A16;
 --destructive: #B4664A;
 --border: rgb(31 107 67 / .12);
 --input: rgb(31 107 67 / .18);
 --ring: var(--leaf);
 --radius: 1.4rem;
}



 *, *::before, *::after { box-sizing: border-box }
 html, body { height: 100%; overscroll-behavior: none; }
 body { background: var(--background); color: var(--foreground); font-family: var(--body); -webkit-font-smoothing: antialiased; margin: 0 }
 button:not(:disabled), [role='button']:not(:disabled), a, label.tap { cursor: pointer; touch-action: manipulation; }
 button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
 a { text-decoration: none; color: inherit; }
 button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible,
 textarea:focus-visible, [role='slider']:focus-visible, [tabindex]:focus-visible {
  outline: 2.5px solid var(--leaf); outline-offset: 3px; border-radius: 10px;
 }
 h1, h2, h3, h4 { font-family: var(--round), ui-rounded, sans-serif; text-wrap: balance; margin: 0; }
 p { line-height: 1.55; margin: 0; }


/* ---------- the viewport ---------- */
.stage {
 position: fixed; inset: 0; overflow: hidden;
 max-width: 480px; margin-inline: auto; background: var(--ivory);
 box-shadow: 0 0 80px -30px rgb(24 70 46 / .35);
}
@media (min-width: 520px) { body { background: #E9DFCC } }
.meadow { position: absolute; inset: 0; z-index: 0 }
.meadow-canvas { display: block; width: 100%; height: 100%; touch-action: manipulation }

/* ---------- what floats over the meadow ---------- */
.topbar {
 position: absolute; z-index: 12; top: calc(env(safe-area-inset-top) + 12px); left: 20px; right: 16px;
 display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none;
}
.topbar > * { pointer-events: auto }
.brand { display: flex; align-items: flex-start; gap: 8px; font-family: var(--round), sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -.6px; color: var(--ink); text-shadow: 0 2px 12px rgb(255 255 255 / .6) }
.brand svg { width: 27px; height: 27px; flex-shrink: 0; margin-top: 3px }
.brand-stack { display: flex; flex-direction: column }
.brand-word { line-height: 1 }
.brand-line { font-family: var(--script), cursive; font-weight: 500; font-size: 16px; line-height: 1.08; color: var(--ink-mid); margin-top: 3px; letter-spacing: .2px; max-width: 130px; text-shadow: 0 1px 8px rgb(255 255 255 / .7) }
.top-acts { display: flex; align-items: center; gap: 9px }
.disc {
 position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
 background: rgb(254 252 245 / .94); box-shadow: var(--shadow-soft); color: var(--ink); flex-shrink: 0;
 transition: transform .22s cubic-bezier(.22,.9,.28,1), background .2s;
}
.disc:hover { background: #fff }
.disc:active { transform: scale(.93) }
.disc svg { width: 20px; height: 20px; stroke-width: 1.9 }
.disc[data-tint='leaf'] { background: #C9E5C7 }
.disc i { position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }
.script-note {
 position: absolute; z-index: 11; right: 74px; top: calc(env(safe-area-inset-top) + 116px);
 font-family: var(--script), cursive; font-size: 21px; line-height: 1.15; color: var(--ink-mid);
 text-align: center; max-width: 160px; transform: rotate(-3.5deg); pointer-events: none;
 text-shadow: 0 2px 14px rgb(255 255 255 / .75);
 animation: settle .9s cubic-bezier(.22,.9,.28,1) both .25s;
}
@keyframes settle { from { opacity: 0; transform: rotate(-3.5deg) translateY(-8px) } to { opacity: 1; transform: rotate(-3.5deg) translateY(0) } }

/* ---------- the instants rail ---------- */
.rail {
 position: absolute; z-index: 12; right: 12px; top: 22%;
 display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 9px 7px;
 border-radius: 34px; background: rgb(254 252 245 / .92); box-shadow: var(--shadow-card);
 backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.rail-dot { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.rail-dot:hover { transform: scale(1.06) }
.rail-dot:active { transform: scale(.94) }
.rail-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent }
.rail-dot[data-unseen='true'] .rail-ring { border-color: var(--blush); box-shadow: 0 0 0 2px rgb(254 252 245 / .9) inset }
.rail-face { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; display: grid; place-items: center }
.rail-photo { width: 100%; height: 100%; object-fit: cover }
.rail-initial { font-family: var(--round), sans-serif; font-weight: 700; font-size: 15px; color: #4B5B4C }
.rail-camera {
 width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; margin-top: 2px;
 background: linear-gradient(160deg, var(--leaf-bright), #4A8E58); color: #FEFCF5;
 box-shadow: 0 8px 16px -8px rgb(31 107 67 / .8); transition: transform .2s cubic-bezier(.22,.9,.28,1);
}
.rail-camera:hover { transform: scale(1.06) } .rail-camera:active { transform: scale(.92) }
.rail-camera svg { width: 21px; height: 21px; stroke-width: 1.9 }

/* ---------- the meadow chip ---------- */
.meadow-chip {
 position: absolute; z-index: 11; left: 18px; bottom: calc(48dvh + 16px); display: flex; align-items: center; gap: 9px;
 transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0);
 padding: 11px 17px; border-radius: 99px; background: rgb(254 252 245 / .94);
 font-family: var(--round), sans-serif; font-weight: 700; font-size: 14.5px; color: var(--ink-deep);
 box-shadow: var(--shadow-card); white-space: nowrap;
 transition: transform .42s cubic-bezier(.22, .9, .28, 1), opacity .3s;
}
.meadow-chip:active { transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0) scale(.96) }
.meadow-chip svg { width: 18px; height: 18px; flex-shrink: 0 }
.meadow-chip .caret { width: 14px; height: 14px; stroke-width: 2.4; color: var(--ink-faint) }
/* The weather glyph turns over as the sky does. */
.weather-turn { display: grid; place-items: center; width: 20px; height: 20px }
.weather-turn > * { grid-area: 1 / 1; animation: turn-in .62s cubic-bezier(.22,.9,.28,1) both }
@keyframes turn-in { from { opacity: 0; transform: rotate(-110deg) scale(.5) } to { opacity: 1; transform: none } }

/* ---------- the sheet ---------- */
.sheet {
 position: absolute; left: 0; right: 0; top: 52dvh; height: 89dvh; z-index: 20;
 transform: translate3d(0, calc(-41dvh * var(--lift, 0)), 0);
 transition: transform .42s cubic-bezier(.22, .9, .28, 1);
 display: flex; flex-direction: column;
 background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory) 62%, var(--ivory-deep) 100%);
 border-radius: 30px 30px 0 0; box-shadow: var(--shadow-lift);
 overscroll-behavior: contain;
}
.stage[data-dragging='true'] .sheet,
.stage[data-dragging='true'] .meadow-chip { transition: none }
.sheet::before {
 content: ''; position: absolute; inset: 0 0 auto; height: 30px; border-radius: 30px 30px 0 0;
 box-shadow: inset 0 1.5px 0 rgb(255 255 255 / .9); pointer-events: none;
}
.sheet-grab { display: grid; place-items: center; width: 100%; height: 44px; margin-bottom: -18px; flex-shrink: 0; touch-action: none }
.sheet-grab span { width: 42px; height: 5px; border-radius: 99px; background: #CFD8C9; transition: background .2s, width .24s cubic-bezier(.22,.9,.28,1) }
.sheet-grab:hover span { background: #B9C6B2; width: 52px }
.sheet-scroll {
 flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
 padding-bottom: calc(112px + env(safe-area-inset-bottom)); touch-action: pan-y;
}
.sheet-scroll::-webkit-scrollbar { width: 0 }

/* ---------- page furniture inside the sheet ---------- */
.wrap { padding: 0 20px }
.eyebrow { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--ink-soft) }
.page-head { padding: 4px 20px 16px }
.page-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.9px; color: var(--ink-deep); margin: 7px 0 6px }
.page-head p { font-size: 15.5px; color: var(--ink-mid) }
.flow { display: flex; flex-direction: column; gap: 14px }
.small { font-size: 13.5px; line-height: 1.5; color: var(--ink-soft) }
.card { position: relative; background: var(--paper); border-radius: 24px; box-shadow: var(--shadow-card); overflow: hidden }
.card-pad { padding: 18px 18px 20px }
.tint-card { border-radius: 22px; padding: 16px; box-shadow: var(--shadow-card) }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px }
.row-head h2 { font-size: 23px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.4px; display: flex; align-items: center; gap: 8px }
.squiggle { width: 46px; height: 10px; color: var(--leaf); opacity: .7; flex-shrink: 0 }
.pill-link {
 display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 8px 14px; border-radius: 99px;
 background: var(--paper); box-shadow: var(--shadow-soft);
 font-family: var(--round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink);
 transition: transform .2s cubic-bezier(.22,.9,.28,1);
}
.pill-link:active { transform: scale(.95) }
.pill-link svg { width: 13px; height: 13px; stroke-width: 2.4 }
.text-link { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; font-family: var(--round), sans-serif; font-weight: 700; font-size: 13.5px; color: var(--ink-soft) }
.text-link:hover { color: var(--ink) }
.text-link svg { width: 14px; height: 14px; stroke-width: 2.4 }
.note-strip { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ink-soft) }
.note-strip svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; color: var(--leaf) }
.fineprint { font-size: 12px; color: var(--ink-faint); text-align: center; line-height: 1.6 }

/* Every card in a list arrives a beat after the one above it. */
.stagger > * { animation: rise .5s cubic-bezier(.22,.9,.28,1) both; animation-delay: calc(var(--i, 0) * 55ms) }
@keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

/* ---------- controls ---------- */
.btn {
 display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px;
 border-radius: 16px; background: var(--ink); color: #FEFCF5;
 font-family: var(--round), sans-serif; font-weight: 700; font-size: 15.5px;
 box-shadow: 0 10px 22px -14px rgb(19 73 44 / .95);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s, box-shadow .18s;
}
.btn:hover { background: #1A5E3B }
.btn:active { transform: translateY(1px) scale(.985) }
.btn:disabled { opacity: .42; box-shadow: none; transform: none }
.btn svg { width: 18px; height: 18px; stroke-width: 2 }
.btn-soft { background: #E4F0E2; color: var(--ink); box-shadow: none }
.btn-soft:hover { background: #D7E9D5 }
.btn-quiet { background: transparent; color: var(--ink-soft); font-weight: 700; min-height: 44px; box-shadow: none }
.btn-quiet:hover { background: rgb(31 107 67 / .06); color: var(--ink) }
.btn-block { width: 100% }
.input, select.input, textarea.input {
 width: 100%; min-height: 48px; padding: 12px 15px; border-radius: 14px; background: var(--paper);
 border: 0; box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .14); font: inherit; font-size: 15px; color: var(--ink-deep);
 transition: box-shadow .18s;
}
.input::placeholder { color: var(--ink-faint) }
.input:focus-visible { outline: none; box-shadow: inset 0 0 0 2.5px var(--leaf) }
textarea.input { min-height: 92px; resize: none; line-height: 1.5 }
.label { display: block; font-family: var(--round), sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip-choice {
 padding: 9px 14px; border-radius: 99px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .14);
 font-family: var(--round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-soft);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s, color .18s, box-shadow .18s;
}
.chip-choice:hover { box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .3) }
.chip-choice:active { transform: scale(.95) }
.chip-choice[aria-pressed='true'], .chip-choice[aria-checked='true'] { background: var(--gold); color: #4A3A16; box-shadow: none }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px }
.switch-row b { display: block; font-family: var(--round), sans-serif; font-weight: 700; font-size: 15.5px; color: var(--ink-deep) }
.toggle { position: relative; width: 52px; height: 31px; border-radius: 99px; background: #DCE5D7; flex-shrink: 0; transition: background .25s }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 25px; height: 25px; border-radius: 50%; background: var(--paper); box-shadow: 0 2px 6px -2px rgb(24 70 46 / .6); transition: transform .28s cubic-bezier(.3,1.4,.5,1) }
.toggle[aria-pressed='true'] { background: var(--leaf) }
.toggle[aria-pressed='true']::after { transform: translateX(21px) }

/* ---------- feelings ---------- */
.feelings { padding: 18px 18px 20px }
.feelings h2 { font-size: 30px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.7px; margin: 6px 0 3px }
.feelings > p { font-size: 15px; color: var(--ink-mid) }
.feelings-sprig { position: absolute; right: -6px; top: 6px; width: 96px; opacity: .95; pointer-events: none }
.mood { position: relative; height: 48px; margin-top: 14px; padding-inline: 24px; touch-action: none }
.mood-rail { position: absolute; left: 24px; right: 24px; top: 50%; height: 11px; margin-top: -5.5px; border-radius: 99px; background: #E3EEDE }
.mood-fill { position: absolute; left: 24px; right: 24px; top: 50%; height: 11px; margin-top: -5.5px; border-radius: 99px; background: linear-gradient(90deg, #BDE0BF, #86C293); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform .42s cubic-bezier(.22, .9, .28, 1) }
/* The run is exactly the knob travel, so a percentage translate lands it on the mark. */
.mood-run { position: absolute; left: 24px; right: 24px; top: 50%; height: 0; transform: translateX(calc(var(--p, 0) * 100%)); transition: transform .42s cubic-bezier(.22, .9, .28, 1) }
.mood-knob { position: absolute; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: #E4F0E2; display: grid; place-items: center; box-shadow: 0 8px 16px -8px rgb(31 107 67 / .6); transition: transform .2s }
.mood[data-dragging='true'] .mood-run, .mood[data-dragging='true'] .mood-fill { transition: none }
.mood[data-dragging='true'] .mood-knob { transform: scale(1.08) }
.mood-knob svg { width: 22px; height: 22px; color: var(--ink) }
.mood-scale { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-faint); margin-top: 4px; padding-inline: 2px }

/* ---------- people ---------- */
.people-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px }
.person { position: relative; display: flex; flex-direction: column; padding: 13px 13px 12px; text-align: left; border-radius: 22px; box-shadow: var(--shadow-card); overflow: hidden; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.person:active { transform: scale(.985) }
.person-sprig { position: absolute; right: -4px; bottom: 4px; width: 58px; opacity: .8; pointer-events: none }
.person-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100% }
.person h3 { font-size: 16px; font-weight: 700; color: var(--ink-deep); margin: 9px 0 3px }
.person-note { font-size: 12.5px; line-height: 1.4; color: var(--ink-mid); min-height: 35px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; position: relative; z-index: 1 }
.person-foot { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11.5px; color: var(--ink-soft); position: relative; z-index: 1 }
.person-foot svg { width: 13px; height: 13px; flex-shrink: 0 }
.call-now {
 display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 44px; margin-top: 10px;
 border-radius: 14px; background: rgb(254 252 245 / .82); color: var(--ink);
 font-family: var(--round), sans-serif; font-weight: 700; font-size: 13px; position: relative; z-index: 1;
 box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .16);
 transition: transform .18s cubic-bezier(.22,.9,.28,1), background .18s;
}
.call-now:hover { background: #fff }
.call-now:active { transform: scale(.96) }
.call-now svg { width: 14px; height: 14px; stroke-width: 2 }
.unread { position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }

/* ---------- avatars ---------- */
.avatar { display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; font-family: var(--round), sans-serif; font-weight: 700; color: #43543F; flex-shrink: 0 }
.avatar-gold { background: var(--av-gold) } .avatar-green { background: var(--av-mint) }
.avatar-orange { background: var(--av-rose) } .avatar-sky { background: var(--av-blue) }
.avatar-photo { width: 100%; height: 100%; object-fit: cover }
.avatar-xs { width: 26px; height: 26px; font-size: 11px }
.avatar-sm { width: 34px; height: 34px; font-size: 14px }
.avatar-md { width: 42px; height: 42px; font-size: 17px }
.avatar-lg { width: 56px; height: 56px; font-size: 22px }
.avatar-xl { width: 92px; height: 92px; font-size: 36px }
.tint-gold { background: var(--tint-yellow) } .tint-green { background: var(--tint-mint) }
.tint-orange { background: var(--tint-rose) } .tint-sky { background: var(--tint-blue) }

/* ---------- a little something ---------- */
.something { display: flex; align-items: flex-end; gap: 12px }
.notes-rail {
 display: flex; gap: 22px; overflow-x: auto; flex: 1; min-width: 0; padding: 56px 6px 6px 2px; scrollbar-width: none;
 -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
 mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 22px), transparent 100%);
}
.notes-rail::-webkit-scrollbar { display: none }
.note-item { position: relative; flex: 0 0 auto; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.note-item:active { transform: scale(.95) }
.note-bubble {
 position: absolute; bottom: calc(100% - 2px); left: 50%; transform: translateX(-50%);
 width: 76px; max-height: 46px; padding: 6px 8px; border-radius: 13px 13px 13px 4px;
 background: var(--paper); box-shadow: var(--shadow-soft); font-size: 10px; line-height: 1.3; color: var(--ink-deep);
 text-align: left; overflow: hidden; z-index: 2;
}
.note-face { position: relative; width: 60px; height: 60px; border-radius: 20px; display: grid; place-items: center; box-shadow: var(--shadow-card); overflow: hidden }
.note-face svg { width: 23px; height: 23px; stroke-width: 1.9; color: #43543F }
.note-initial { font-family: var(--round), sans-serif; font-weight: 700; font-size: 22px; color: #43543F }
.note-name { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.note-dot { position: absolute; top: 4px; right: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--blush); box-shadow: 0 0 0 2.5px var(--paper) }

/* ---------- small rows ---------- */
.row {
 display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 15px; border-radius: 20px;
 background: var(--paper); box-shadow: var(--shadow-card); text-align: left;
 transition: transform .2s cubic-bezier(.22,.9,.28,1);
}
.row:active { transform: scale(.985) }
.row-icon { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; background: var(--tint-mint) }
.row-icon svg { width: 18px; height: 18px; stroke-width: 1.9; color: #43543F }
.row-body { flex: 1; min-width: 0 }
.row-body b { display: block; font-family: var(--round), sans-serif; font-size: 14.5px; font-weight: 700; color: var(--ink-deep) }
.row-body span { display: block; font-size: 12.5px; color: var(--ink-soft) }
.caret { width: 15px; height: 15px; flex-shrink: 0; color: var(--ink-faint); stroke-width: 2.2 }
.empty { padding: 18px 16px; border-radius: 20px; background: rgb(254 252 245 / .6); font-size: 13.5px; color: var(--ink-soft); text-align: center }

/* ---------- the little-something tile row ---------- */
.tool-row { display: flex; gap: 4px; padding: 10px 6px; background: var(--paper); border-radius: 22px; box-shadow: var(--shadow-card); overflow-x: auto; scrollbar-width: none }
.tool-row::-webkit-scrollbar { display: none }
.tool { flex: 1 0 62px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 2px; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.tool:active { transform: scale(.92) }
.tool-disc { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center }
.tool-disc svg { width: 21px; height: 21px; stroke-width: 1.8 }
.tool b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-mid) }

/* ---------- bottom nav ---------- */
.nav {
 position: absolute; z-index: 30; left: 50%; transform: translateX(-50%);
 bottom: calc(14px + env(safe-area-inset-bottom)); width: min(400px, calc(100% - 28px)); height: 66px;
 display: flex; align-items: center; justify-content: space-around; padding: 0 4px;
 border-radius: 26px; background: rgb(254 252 245 / .97); box-shadow: 0 14px 30px -14px rgb(24 70 46 / .55);
 backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 60px; color: var(--ink-faint); transition: color .2s, transform .2s cubic-bezier(.22,.9,.28,1) }
.nav-item:active { transform: scale(.92) }
.nav-item svg { width: 21px; height: 21px; stroke-width: 1.9 }
.nav-item b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11px }
.nav-item i { width: 4px; height: 4px; border-radius: 50%; background: transparent; margin-top: 1px }
.nav-item[aria-current='page'] { color: var(--ink) }
.nav-item[aria-current='page'] i { background: var(--ink) }
.nav-share { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 66px; position: relative; top: -12px }
.nav-share-disc {
 position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
 background: #E4F0E2; box-shadow: 0 8px 18px -10px rgb(31 107 67 / .7);
 transition: transform .24s cubic-bezier(.3,1.4,.5,1), background .24s;
}
.nav-share:active .nav-share-disc { transform: scale(.9) }
.nav-share-disc svg { width: 23px; height: 23px; stroke-width: 1.9; color: var(--ink-soft); transition: color .24s }
.nav-share[aria-pressed='true'] .nav-share-disc { background: linear-gradient(160deg, var(--leaf-bright), #4A8E58) }
.nav-share[aria-pressed='true'] .nav-share-disc svg { color: #FEFCF5 }
/* When sharing is on, the leaf gets a few quiet rays, the way the reference draws it. */
.nav-share[aria-pressed='true'] .nav-share-disc::before {
 content: ''; position: absolute; inset: -7px; border-radius: 50%;
 background: conic-gradient(from 0deg, transparent 0 12deg, rgb(242 199 92 / .9) 12deg 15deg, transparent 15deg 57deg, rgb(242 199 92 / .9) 57deg 60deg, transparent 60deg 102deg, rgb(242 199 92 / .9) 102deg 105deg, transparent 105deg 147deg, rgb(242 199 92 / .9) 147deg 150deg, transparent 150deg 192deg, rgb(242 199 92 / .9) 192deg 195deg, transparent 195deg 237deg, rgb(242 199 92 / .9) 237deg 240deg, transparent 240deg 282deg, rgb(242 199 92 / .9) 282deg 285deg, transparent 285deg 327deg, rgb(242 199 92 / .9) 327deg 330deg, transparent 330deg);
 -webkit-mask: radial-gradient(circle, transparent 0 26px, #000 27px); mask: radial-gradient(circle, transparent 0 26px, #000 27px);
 animation: rays 9s linear infinite;
}
@keyframes rays { to { transform: rotate(360deg) } }
.nav-share b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 10.5px; color: var(--ink-faint); white-space: nowrap }
.nav-share[aria-pressed='true'] b { color: var(--ink) }

/* ---------- the week ---------- */
.cal { padding: 12px 10px 10px }
.cal-week { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px }
.cal-week b { font-family: var(--round), sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-deep) }
.cal-step { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background .2s }
.cal-step:hover { background: var(--secondary) }
.cal-step svg { width: 18px; height: 18px; stroke-width: 2.2 }
.cal-head { display: grid; grid-template-columns: 30px repeat(7, 1fr); padding-bottom: 5px }
.cal-head span { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft); text-align: center }
.cal-head span[data-today='true'] { color: var(--ink) }
.cal-head span i { display: block; font-style: normal; font-size: 10px; font-weight: 600; color: var(--ink-faint) }
.cal-body { display: grid; grid-template-columns: 30px 1fr; max-height: 340px; overflow-y: auto; overscroll-behavior: contain }
.cal-body::-webkit-scrollbar { width: 4px }
.cal-body::-webkit-scrollbar-thumb { background: #CFD8C9; border-radius: 99px }
.cal-hours { display: flex; flex-direction: column }
.cal-hour { height: 40px; line-height: 1; font-size: 10px; color: var(--ink-faint); text-align: right; padding: 1px 5px 0 0 }
.cal-grid { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); background: rgb(254 252 245 / .7); border-radius: 12px; overflow: hidden; touch-action: pan-y }
.cal-col { position: relative; border-left: 1px solid var(--hairline) }
.cal-col:first-child { border-left: 0 }
.cal-col[data-today='true'] { background: rgb(242 199 92 / .08) }
.cal-slot { height: 40px; border-top: 1px solid var(--hairline) }
.cal-slot:first-child { border-top: 0 }
.cal-block {
 position: absolute; left: 2px; right: 2px; border-radius: 10px; padding: 4px 5px; overflow: hidden; text-align: left;
 background: var(--ink); color: #FEFCF5; box-shadow: 0 4px 10px -6px rgb(19 73 44 / .9);
 animation: pop-block .32s cubic-bezier(.3,1.3,.5,1) both;
}
@keyframes pop-block { from { opacity: 0; transform: scale(.86) } to { opacity: 1; transform: none } }
.cal-block b { display: block; font-family: var(--round), sans-serif; font-weight: 700; font-size: 9.5px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cal-block span { font-size: 8.5px; opacity: .8; white-space: nowrap }
.cal-block svg { position: absolute; right: 3px; bottom: 2px; width: 11px; height: 11px; opacity: .35 }
.cal-block[data-linked='true'] { background: var(--gold); color: #4A3A16; box-shadow: 0 4px 10px -6px rgb(190 150 40 / .8) }
.cal-draft { position: absolute; left: 2px; right: 2px; border-radius: 10px; background: rgb(89 164 104 / .34); box-shadow: inset 0 0 0 1.5px var(--leaf); pointer-events: none }
.cal-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 4px 0; font-size: 11.5px; color: var(--ink-soft) }
.cal-legend span { display: flex; align-items: center; gap: 6px }
.swatch { width: 11px; height: 11px; border-radius: 4px; flex-shrink: 0 }

/* ---------- scrapbook ---------- */
.scrap { columns: 2; column-gap: 11px; padding-top: 2px }
.polaroid {
 position: relative; break-inside: avoid; margin-bottom: 13px; padding: 8px 8px 12px; background: var(--paper);
 border-radius: 4px; box-shadow: 0 10px 22px -14px rgb(24 70 46 / .7); display: block; width: 100%; text-align: left;
 transition: transform .24s cubic-bezier(.22,.9,.28,1);
}
.polaroid:nth-child(3n) { transform: rotate(1.6deg) } .polaroid:nth-child(3n+1) { transform: rotate(-1.4deg) }
.polaroid:nth-child(4n) { transform: rotate(.8deg) }
.polaroid:hover { transform: rotate(0) scale(1.02); z-index: 2 }
.polaroid-tape { position: absolute; top: -8px; left: 50%; width: 52px; height: 18px; margin-left: -26px; border-radius: 2px; background: rgb(226 239 220 / .82); box-shadow: 0 1px 3px rgb(24 70 46 / .12); transform: rotate(-3deg) }
.polaroid:nth-child(even) .polaroid-tape { background: rgb(251 242 212 / .85); transform: rotate(4deg) }
.polaroid-shot { aspect-ratio: 1; border-radius: 2px; overflow: hidden; display: grid; place-items: center }
.polaroid-shot img { width: 100%; height: 100%; object-fit: cover }
.polaroid-date { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 7px }
.polaroid-note { display: block; font-family: var(--script), cursive; font-size: 15px; line-height: 1.2; color: var(--ink-mid) }
.scrap-note { break-inside: avoid; margin-bottom: 13px; padding: 20px 16px; border-radius: 6px; border: 1.5px dashed rgb(31 107 67 / .3); background: rgb(226 239 220 / .35); font-family: var(--script), cursive; font-size: 18px; line-height: 1.25; color: var(--ink-mid); text-align: center }
.fab {
 position: absolute; z-index: 25; right: 20px; bottom: calc(92px + env(safe-area-inset-bottom));
 width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
 background: linear-gradient(160deg, var(--leaf-bright), #4A8E58); color: #FEFCF5;
 box-shadow: 0 12px 24px -10px rgb(31 107 67 / .9); transition: transform .22s cubic-bezier(.3,1.4,.5,1);
}
.fab:active { transform: scale(.9) }
.fab svg { width: 24px; height: 24px; stroke-width: 2.2 }

/* ---------- share my load ---------- */
.who-row { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none }
.who-row::-webkit-scrollbar { display: none }
.who { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 58px; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.who:active { transform: scale(.93) }
.who-face { position: relative; border-radius: 50%; transition: box-shadow .2s }
.who[aria-pressed='true'] .who-face { box-shadow: 0 0 0 2.5px var(--leaf), 0 0 0 5px rgb(89 164 104 / .22) }
.who b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 11.5px; color: var(--ink-soft) }
.who[aria-pressed='true'] b { color: var(--ink) }
.who-add { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--tint-blue); color: var(--ink) }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 15px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-card); text-align: left }
.pick-mark { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 2px rgb(31 107 67 / .28); transition: box-shadow .2s, background .2s }
.pick[aria-checked='true'] .pick-mark { background: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 5px var(--paper) }

/* ---------- overlays ---------- */
.scrim { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgb(24 52 38 / .5); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); animation: fade .24s ease both }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.panel { width: 100%; max-width: 340px; background: var(--paper); border-radius: 28px; padding: 16px 18px 14px; box-shadow: 0 30px 70px -34px rgb(12 30 20 / .9); animation: pop .38s cubic-bezier(.25,1.2,.35,1) both }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.94) } to { opacity: 1; transform: none } }
.vitrine { position: relative; height: 196px; border-radius: 22px; overflow: hidden; background: linear-gradient(164deg, #ECF6EC 0%, #D8EBDB 56%, #C3DEC8 100%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .85), inset 0 -34px 38px -30px rgb(31 107 67 / .45) }
.vitrine::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(118deg, rgb(255 255 255 / .66) 0 20%, rgb(255 255 255 / .06) 40%, rgb(255 255 255 / 0) 56%) }
.vitrine-shadow { position: absolute; left: 50%; bottom: 24px; width: 112px; height: 14px; margin-left: -56px; border-radius: 50%; background: radial-gradient(ellipse, rgb(31 107 67 / .22), rgb(31 107 67 / 0) 70%) }
.vitrine-stage { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite }
@keyframes sway { 0%, 100% { transform: translateX(-50%) rotate(-2deg) } 50% { transform: translateX(-50%) rotate(2deg) } }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 13px 2px 2px }
.panel-head h3 { font-size: 22px; font-weight: 700; color: var(--ink-deep) }
.panel-who { font-size: 13px; color: var(--ink-soft) }
.panel-rows { display: flex; flex-direction: column; margin-top: 8px }
.panel-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 10px 2px; border-bottom: 1px solid var(--hairline); font-size: 14px }
.panel-row:last-child { border-bottom: 0 }
.panel-row b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ink-soft); white-space: nowrap }
.panel-row span { text-align: right; color: var(--ink-deep) }

.curtain { position: absolute; inset: 0; z-index: 70; display: grid; place-items: center; padding: 20px; overflow-y: auto; background: linear-gradient(172deg, #FBF5E9 0%, #F3E9D6 55%, #E7DCC7 100%); animation: fade .24s ease both }
.curtain-sheet { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 22px 0 }
.curtain-title { font-size: 30px; font-weight: 700; color: var(--ink-deep); letter-spacing: -.7px; text-align: center }
.curtain-sub { font-size: 14.5px; color: var(--ink-soft); text-align: center; max-width: 290px }
.halo { position: relative; display: grid; place-items: center; padding: 8px; border-radius: 50%; background: rgb(254 252 245 / .85); box-shadow: 0 16px 34px -20px rgb(31 107 67 / .8) }
.halo::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgb(89 164 104 / .35); animation: ping 2.4s ease-out infinite }
@keyframes ping { 0% { transform: scale(.96); opacity: .9 } 100% { transform: scale(1.18); opacity: 0 } }
.paths { display: flex; flex-direction: column; gap: 9px; width: 100% }
.path { display: grid; grid-template-columns: 42px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 13px 15px; border-radius: 19px; background: var(--paper); box-shadow: var(--shadow-card); text-align: left; transition: transform .2s cubic-bezier(.22,.9,.28,1) }
.path:active { transform: scale(.98) }
.path-icon { grid-row: 1 / 3; width: 42px; height: 42px; border-radius: 14px; background: #E4F0E2; display: grid; place-items: center }
.path-icon svg { width: 19px; height: 19px; stroke-width: 1.9; color: var(--ink) }
.path b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 15px; color: var(--ink-deep) }
.path span { font-size: 12px; color: var(--ink-soft) }
.timer { font-family: var(--round), sans-serif; font-weight: 700; font-size: 32px; color: var(--ink); font-variant-numeric: tabular-nums }
.bloom-stage { display: grid; place-items: end center; height: 180px }
.bloom-svg { width: 180px; height: 180px; overflow: visible }
.bloom-ground { fill: rgb(31 107 67 / .13) }
.flower-bloom .flower-petal { transform-box: fill-box; transform-origin: center; animation: petal .7s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--i) * 38ms + 120ms) }
.flower-bloom .flower-heart { transform-box: fill-box; transform-origin: center; animation: petal .5s cubic-bezier(.2,.9,.3,1.2) both }
.flower-bloom .flower-stem, .flower-bloom .flower-leaf { animation: sprout .55s ease-out both }
@keyframes petal { from { transform: scale(.1); opacity: 0 } to { transform: scale(1); opacity: 1 } }
@keyframes sprout { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.flower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; width: 100% }
.flower-option { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 11px 9px; border-radius: 18px; background: var(--paper); box-shadow: inset 0 0 0 1.5px rgb(31 107 67 / .12); transition: transform .2s cubic-bezier(.22,.9,.28,1), box-shadow .2s }
.flower-option:active { transform: scale(.96) }
.flower-option[aria-checked='true'] { box-shadow: inset 0 0 0 2.5px var(--leaf); background: #F4FAF2 }
.flower-option b { font-family: var(--round), sans-serif; font-weight: 700; font-size: 13px; color: var(--ink-deep) }
.flower-option span { font-size: 10.5px; color: var(--ink-soft); text-align: center; line-height: 1.35 }

/* ---------- instants viewer ---------- */
.story { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #10251A; animation: fade .22s ease both }
.story-bars { display: flex; gap: 4px; padding: calc(env(safe-area-inset-top) + 10px) 12px 0 }
.story-bar { flex: 1; height: 2.5px; border-radius: 99px; background: rgb(255 255 255 / .28); overflow: hidden }
.story-bar i { display: block; height: 100%; background: #FEFCF5; border-radius: 99px }
.story-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px }
.story-who { flex: 1; min-width: 0; color: #FEFCF5 }
.story-who b { display: block; font-family: var(--round), sans-serif; font-size: 14.5px; font-weight: 700 }
.story-who span { font-size: 12px; color: rgb(254 252 245 / .6) }
.story-icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #FEFCF5; transition: background .2s }
.story-icon:hover { background: rgb(255 255 255 / .12) }
.story-icon:disabled { opacity: .4 }
.story-icon svg { width: 21px; height: 21px; stroke-width: 1.9 }
.story-stage { position: relative; flex: 1; display: grid; place-items: center; padding: 4px 16px 10px; min-height: 0 }
.story-frame { position: relative; width: 100%; max-width: 340px; aspect-ratio: 3 / 4; border-radius: 22px; overflow: hidden; display: grid; place-items: center; box-shadow: 0 30px 60px -30px #000 }
.story-photo { width: 100%; height: 100%; object-fit: cover }
.story-empty { width: 100%; height: 100% }
.story-caption { position: absolute; left: 18px; right: 18px; bottom: 26px; font-family: var(--script), cursive; font-size: 21px; line-height: 1.2; color: #FEFCF5; text-align: center; text-shadow: 0 2px 12px rgb(16 37 26 / .8) }
.story-half { position: absolute; top: 0; bottom: 0; width: 34%; background: transparent }
.story-prev { left: 0 } .story-next { right: 0 }
.story-reply { display: flex; align-items: center; gap: 8px; padding: 0 14px calc(16px + env(safe-area-inset-bottom)) }
.story-input { flex: 1; min-width: 0; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1.5px solid rgb(255 255 255 / .35); background: transparent; color: #FEFCF5; font: inherit; font-size: 14px }
.story-input::placeholder { color: rgb(254 252 245 / .5) }
.story-input:focus-visible { outline: none; border-color: #FEFCF5 }

/* ---------- camera ---------- */
.camera { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; background: #17281D; animation: fade .22s ease both }
.camera-bar { display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 12px) 12px 4px; color: #FEFCF5 }
.camera-title { font-family: var(--round), sans-serif; font-weight: 700; font-size: 15px }
.camera-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 6px 20px; min-height: 0 }
.camera-frame { position: relative; width: 100%; max-width: 330px; aspect-ratio: 3 / 4; border-radius: 26px; overflow: hidden; background: #24382A; display: grid; place-items: center }
.camera-feed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1) }
img.camera-feed { transform: none }
.camera-corners { position: absolute; inset: 10px; border-radius: 20px; pointer-events: none; background:
 linear-gradient(#FEFCF5, #FEFCF5) 0 0 / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 0 0 / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 100% 0 / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 100% 0 / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 0 100% / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 0 100% / 2px 26px no-repeat,
 linear-gradient(#FEFCF5, #FEFCF5) 100% 100% / 26px 2px no-repeat, linear-gradient(#FEFCF5, #FEFCF5) 100% 100% / 2px 26px no-repeat;
 opacity: .8;
}
.camera-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; height: 100%; padding: 24px; text-align: center; color: #FEFCF5 }
.camera-fallback svg { width: 28px; height: 28px }
.camera-fallback b { font-family: var(--round), sans-serif; font-size: 17px }
.camera-fallback span { font-size: 13px; color: rgb(254 252 245 / .7) }
.camera-caption { width: 100%; max-width: 330px; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1.5px solid rgb(255 255 255 / .35); background: transparent; color: #FEFCF5; font-family: var(--script), cursive; font-size: 18px; text-align: center }
.camera-caption::placeholder { color: rgb(254 252 245 / .5) }
.camera-deck { display: flex; align-items: center; justify-content: center; gap: 26px; padding: 8px 20px 6px }

/* ============================ the meadow ============================ */
const holder = $('meadow'), canvas = $('field'), ctx = canvas.getContext('2d')
let scene = null, blooms = [], backdrop = null, fading = null, painted = null, hits = []
let dpr = 1, cssW = 0, cssH = 0, signature = ''
const fieldTop = () => cssH * 0.52

function rebuild() { scene = buildScene(cssW, cssH, fieldTop()); backdrop = null; painted = null; signature = '' }
function repaintBackdrop(weather) {
 const next = document.createElement('canvas')
 next.width = Math.round(cssW * dpr); next.height = Math.round(cssH * dpr)
 const b = next.getContext('2d')
 b.setTransform(dpr, 0, 0, dpr, 0, 0)
 paintBackdrop(b, scene, weather)
 if (backdrop && painted && painted !== weather) fading = { from: backdrop, at: performance.now() }
 backdrop = next; painted = weather
}
new ResizeObserver(entries => {
 const r = entries[0].contentRect
 dpr = Math.min(window.devicePixelRatio || 1, 2)
 cssW = r.width; cssH = r.height
 canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr)
 rebuild()
}).observe(holder)

function render(now) {
 requestAnimationFrame(render)
 if (!cssW || !cssH) return
 if (!scene) rebuild()
 if (painted !== S.weather) repaintBackdrop(S.weather)
 const sig = PEOPLE.length + '|' + CALLS.length
 if (sig !== signature) { blooms = placeBlooms(PEOPLE, CALLS, cssW, fieldTop(), scene.horizon); signature = sig }

 ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
 ctx.clearRect(0, 0, cssW, cssH)
 ctx.save()
 ctx.translate(0, -S.lift * 46)
 if (backdrop) ctx.drawImage(backdrop, 0, 0, cssW, cssH)
 if (fading) {
  const mix = Math.min(1, (now - fading.at) / 900)
  ctx.globalAlpha = 1 - mix; ctx.drawImage(fading.from, 0, 0, cssW, cssH); ctx.globalAlpha = 1
  if (mix >= 1) fading = null
 }
 paintClouds(ctx, scene, S.weather, now)
 paintField(ctx, scene, S.weather, now)
 const strength = windStrength[S.weather]
 hits = []
 for (const bloom of blooms) {
  const fresh = S.fresh === bloom.moment.id
  const head = paintBloom(ctx, bloom, now, strength, fresh ? Math.max(0, 1 - (now % 4000) / 4000) * 0.5 : 0)
  hits.push({ x: head.hx, y: head.hy - S.lift * 46, r: Math.max(head.r, 15), bloom })
  if (fresh) {
   const pulse = 1 + ((now % 1800) / 1800) * 1.1
   ctx.strokeStyle = 'rgba(254,252,245,.9)'; ctx.lineWidth = 2
   ctx.globalAlpha = Math.max(0, 1 - (now % 1800) / 1800)
   ctx.beginPath(); ctx.arc(head.hx, head.hy, head.r * pulse, 0, 6.283185); ctx.stroke()
   ctx.globalAlpha = 1
  }
 }
 paintWeather(ctx, scene, S.weather, now)
 ctx.restore()
}
requestAnimationFrame(render)

canvas.addEventListener('pointerdown', e => {
 const r = canvas.getBoundingClientRect()
 const x = e.clientX - r.left, y = e.clientY - r.top
 let found = null, best = Infinity
 for (const h of hits) {
  const d = Math.hypot(h.x - x, h.y - y)
  if (d < h.r * 1.6 && d < best) { best = d; found = h.bloom }
 }
 if (found) openCase(found.moment)
})

const REST = 0.52, UP = 0.11, SLOP = 6
const sheet = $('sheet'), scroller = $('sheetScroll'), grab = $('sheetGrab')
let drag = null
const stage = document.querySelector('.stage')
function setLift(v) {
 S.lift = Math.min(1, Math.max(0, v))
 stage.style.setProperty('--lift', String(S.lift))
 const chip = $('chip')
 chip.style.opacity = S.lift > 0.72 ? '0' : '1'
 chip.style.pointerEvents = S.lift > 0.72 ? 'none' : 'auto'
 grab.setAttribute('aria-expanded', String(S.lift > 0.5))
 grab.setAttribute('aria-label', S.lift > 0.5 ? 'Lower the panel' : 'Raise the panel')
}
function startDrag(e, collapseOnly) {
 if (collapseOnly && scroller.scrollTop > 0) return
 drag = { y: e.clientY, from: S.lift, at: performance.now(), last: e.clientY, v: 0, moved: false, collapseOnly }
}
function moveDrag(e) {
 if (!drag) return
 const dy = e.clientY - drag.y
 if (drag.collapseOnly && dy <= SLOP) return
 if (!drag.moved && Math.abs(dy) < SLOP) return
 if (!drag.moved) { drag.moved = true; stage.dataset.dragging = 'true' }
 setLift(drag.from - dy / (window.innerHeight * (REST - UP)))
 const now = performance.now()
 drag.v = (e.clientY - drag.last) / Math.max(now - drag.at, 1)
 drag.last = e.clientY; drag.at = now
}
function endDrag() {
 const d = drag; drag = null
 stage.dataset.dragging = 'false'
 if (!d || !d.moved) return
 if (Math.abs(d.v) > 0.5) setLift(d.v < 0 ? 1 : 0)
 else setLift(S.lift > 0.5 ? 1 : 0)
}
grab.addEventListener('pointerdown', e => { grab.setPointerCapture(e.pointerId); startDrag(e, false) })
grab.addEventListener('pointermove', moveDrag)
grab.addEventListener('pointerup', () => { const wasDrag = drag && drag.moved; endDrag(); if (!wasDrag) setLift(S.lift > 0.5 ? 0 : 1) })
grab.addEventListener('pointercancel', endDrag)
scroller.addEventListener('pointerdown', e => startDrag(e, true))
scroller.addEventListener('pointermove', moveDrag)
scroller.addEventListener('pointerup', endDrag)
scroller.addEventListener('pointercancel', endDrag)
setLift(0)

/* ---------- the week ---------- */
const SLOT = 30, HOUR_PX = 40, OPEN = 7 * 60, CLOSE = 22 * 60
const LETTERS = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
const clockLabel = m => (Math.floor(m / 60) % 12 || 12) + ':' + String(m % 60).padStart(2, '0') + (m >= 720 ? ' pm' : ' am')
const hourLabel = m => (Math.floor(m / 60) % 12 || 12) + (m < 720 ? 'a' : 'p')
const mondayOf = date => { const d = new Date(date); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d }
const weekDays = from => Array.from({ length: 7 }, (_, i) => { const d = new Date(from); d.setDate(d.getDate() + i); return d })
function freeWindows(blocks) {
 const sorted = blocks.slice().sort((a, b) => a.start - b.start)
 const out = []; let cursor = OPEN
 for (const b of sorted) {
  if (b.end <= cursor) continue
  if (b.start > cursor) out.push({ start: cursor, end: Math.min(b.start, CLOSE) })
  cursor = Math.max(cursor, b.end)
  if (cursor >= CLOSE) break
 }
 if (cursor < CLOSE) out.push({ start: cursor, end: CLOSE })
 return out.filter(v => v.end - v.start >= 20)
}

let calDraft = null, calDraftEl = null
function wireSchedule() {
 const grid = $('calGrid')
 if (!grid) return
 scrollHost.querySelectorAll('[data-week]').forEach(b => b.onclick = () => { anchor.setDate(anchor.getDate() + 7 * +b.dataset.week); route('schedule') })

  $('scrimBody').querySelectorAll('[data-provider]').forEach(x => x.onclick = () => {
   S.linked = x.dataset.provider
   weekDays(anchor).forEach((d, i) => {
    const key = dayKey(d)
    const kept = (SCHEDULE[key] || []).filter(b => !b.linked)
    SCHEDULE[key] = kept.concat((TEMPLATE[(i + 2) % 7] || []).map(b => ({ start: b[0], end: b[1], label: b[2], linked: true }))).sort((a, b) => a.start - b.start)
   })
   closeScrim(); route('schedule'); toast(S.linked + ' filled this week in.')
  })
 })
 scrollHost.querySelectorAll('[data-act="unlink"]').forEach(b => b.onclick = () => {
  Object.keys(SCHEDULE).forEach(k => { SCHEDULE[k] = SCHEDULE[k].filter(b => !b.linked) })
  S.linked = null; route('schedule'); toast('Unlinked. Your own blocks are untouched.')
 })
 grid.querySelectorAll('.cal-block').forEach(b => {
  b.addEventListener('pointerdown', e => e.stopPropagation())
  b.onclick = () => {
   const key = b.dataset.day, index = +b.dataset.index, block = SCHEDULE[key][index]
   openScrim('<div class="panel"><h3 style="font-size:21px;color:var(--ink-deep)">' + esc(block.label || 'Busy') + '</h3>' +
    '<p class="small" style="margin:4px 0 14px">' + clockLabel(block.start) + ' – ' + clockLabel(block.end) + (block.linked ? ' · from your calendar' : '') + '</p>' +
    '<button class="btn btn-soft btn-block" id="clearBlock">' + I.trash + 'Clear This Block</button>' +
    '<button class="btn btn-quiet btn-block" style="margin-top:8px" data-close>Leave it</button></div>')
   $('clearBlock').onclick = () => { SCHEDULE[key].splice(index, 1); closeScrim(); route('schedule'); toast('Cleared. That time is yours again.') }
   $('scrimBody').querySelector('[data-close]').onclick = closeScrim
  }
 })
 const read = (x, y) => {
  const box = grid.getBoundingClientRect()
  const column = Math.min(6, Math.max(0, Math.floor(((x - box.left) / box.width) * 7)))
  const raw = OPEN + ((y - box.top) / HOUR_PX) * 60
  return { column, at: Math.min(CLOSE, Math.max(OPEN, Math.round(raw / SLOT) * SLOT)) }
 }
 grid.addEventListener('pointerdown', e => {
  const hit = read(e.clientX, e.clientY)
  grid.setPointerCapture(e.pointerId)
  calDraft = { column: hit.column, from: hit.at, to: Math.min(CLOSE, hit.at + SLOT) }
  calDraftEl = el('<span class="cal-draft"></span>')
  grid.children[hit.column].appendChild(calDraftEl)
  paintDraft()
 })
 grid.addEventListener('pointermove', e => {
  if (!calDraft) return
  const hit = read(e.clientX, e.clientY)
  calDraft.to = Math.max(calDraft.from + SLOT, Math.min(CLOSE, hit.at))
  paintDraft()
 })
 grid.addEventListener('pointerup', () => {
  if (!calDraft) return
  const { column, from, to } = calDraft
  if (calDraftEl) calDraftEl.remove()
  calDraft = null; calDraftEl = null
  nameBlock(dayKey(weekDays(anchor)[column]), from, to)
 })
}
function paintDraft() {
 if (!calDraftEl) return
 calDraftEl.style.top = ((calDraft.from - OPEN) / 60 * HOUR_PX) + 'px'
 calDraftEl.style.height = ((calDraft.to - calDraft.from) / 60 * HOUR_PX) + 'px'
}

  '<button class="btn btn-block" id="saveBlock">Mark This Time</button>' +

 const rail = $('rail')
 rail.innerHTML = S.instants.slice(0, 4).map((s, i) => {
  const who = person(s.person)
  return '<button class="rail-dot" data-story="' + i + '" data-unseen="' + !s.saved + '" aria-label="Instant from ' + esc(who.name) + ': ' + esc(s.caption) + '">' +
   '<span class="rail-ring"></span><span class="rail-face tint-' + who.tone + '"><span class="rail-initial">' + who.initials + '</span></span></button>'
 }).join('') + '<button class="rail-camera" id="railCam" aria-label="Take an instant">' + I.camera + '</button>'
 rail.querySelectorAll('[data-story]').forEach(b => b.onclick = () => openStory(+b.dataset.story))
 $('railCam').onclick = openCamera
}
drawRail()

const STORY_MS = 5200
let storyIndex = 0, storyHeld = false, storyStart = 0, storyFrame = 0, storyElapsed = 0
function openStory(i) {
 storyIndex = i; storyHeld = false; storyElapsed = 0; storyStart = performance.now()
 $('story').hidden = false
 paintStory()
 cancelAnimationFrame(storyFrame)
 const tick = () => {
  storyFrame = requestAnimationFrame(tick)
  if ($('story').hidden) return
  if (storyHeld) { storyStart = performance.now() - storyElapsed; return }
  storyElapsed = performance.now() - storyStart
  const p = Math.min(1, storyElapsed / STORY_MS)
  const bar = $('storyBars').children[storyIndex]
  if (bar) bar.firstElementChild.style.width = (p * 100) + '%'
  if (p >= 1) { if (storyIndex + 1 < S.instants.length) { storyIndex++; storyElapsed = 0; storyStart = performance.now(); paintStory() } else closeStory() }
 }
 storyFrame = requestAnimationFrame(tick)
}
function closeStory() { $('story').hidden = true; cancelAnimationFrame(storyFrame) }
function paintStory() {
 const s = S.instants[storyIndex], who = person(s.person)
 $('storyBars').innerHTML = S.instants.map((_, i) =>
  '<span class="story-bar"><i style="width:' + (i < storyIndex ? '100%' : '0%') + '"></i></span>').join('')
 const ago = s.ago < 60 ? s.ago + 'm' : s.ago < 1440 ? Math.round(s.ago / 60) + 'h' : Math.round(s.ago / 1440) + 'd'
 $('storyWho').innerHTML = '<b>' + esc(who.name) + '</b><span>' + ago + '</span>'
 $('storyAvatar').className = 'avatar avatar-' + who.tone + ' avatar-sm'
 $('storyAvatar').textContent = who.initials
 $('storyFrame').className = 'story-frame tint-' + who.tone
 $('storyFrame').innerHTML = '<span class="story-empty" style="display:grid;place-items:center">' + flowerSVG(who.bag[0], 120) + '</span>' +
  '<span class="story-caption">' + esc(s.caption) + '</span>'
 $('storyKeep').setAttribute('aria-pressed', String(!!s.saved))
 $('storyKeep').setAttribute('aria-label', s.saved ? 'Remove from your scrapbook' : 'Keep in your scrapbook')
}
$('storyClose').onclick = closeStory
$('storyPrev').onclick = () => { if (storyIndex > 0) { storyIndex--; storyElapsed = 0; storyStart = performance.now(); paintStory() } }
$('storyNext').onclick = () => { if (storyIndex + 1 < S.instants.length) { storyIndex++; storyElapsed = 0; storyStart = performance.now(); paintStory() } else closeStory() }
$('storyStage').addEventListener('pointerdown', () => { storyHeld = true })
$('storyStage').addEventListener('pointerup', () => { storyHeld = false })
$('storyStage').addEventListener('pointercancel', () => { storyHeld = false })
$('storyKeep').onclick = () => { const s = S.instants[storyIndex]; s.saved = !s.saved; paintStory(); toast(s.saved ? 'Kept in your scrapbook.' : 'Let it fade.') }
$('storyReply').addEventListener('submit', e => {
 e.preventDefault()
 const input = $('storyInput')
 if (!input.value.trim()) return
 const who = person(S.instants[storyIndex].person)
 input.value = ''
 toast('Sent to ' + who.name + '.')
})

let camStream = null
function openCamera() {
 $('camera').hidden = false
 const video = $('camFeed')
 navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
  .then(s => { camStream = s; video.srcObject = s; video.play().catch(() => {}) })
  .catch(() => { $('camFallback').hidden = false; video.hidden = true })
 if (!navigator.mediaDevices) { $('camFallback').hidden = false; video.hidden = true }
}
function closeCamera() {
 $('camera').hidden = true
 if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null }
}
$('camClose').onclick = closeCamera
$('camShutter').onclick = () => { closeCamera(); toast('Caught it. It fades unless somebody keeps it.') }
$('camAudience').onclick = e => {
 const b = e.currentTarget
 b.dataset.close = b.dataset.close === '1' ? '0' : '1'
 b.firstChild.textContent = b.dataset.close === '1' ? 'Close family ' : 'Your people '
}

/* ============================ the call, and the cue ============================ */
let callState = null, callTimer = null
const clock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
function startCall(id) {
 const who = person(id)
 callState = { id, seconds: 0, minutes: 1, feeling: 'steady', flower: 'daisy', topic: '' }
 openCurtain('<span class="eyebrow">Simulated call · no audio</span>' +
  '<span class="halo"><span class="avatar avatar-' + who.tone + ' avatar-xl">' + who.initials + '</span></span>' +
  '<h1 class="curtain-title">' + esc(who.name) + '</h1><p class="timer" id="callTimer">0:00</p>' +
  '<p class="curtain-sub">Talk for as long or as little as suits you. Two minutes counts.</p>' +
  '<button class="btn btn-block" id="endCall">End Call</button>' +
  '<button class="btn btn-quiet" id="cancelCall">never mind, back out</button>')
 clearInterval(callTimer)
 callTimer = setInterval(() => { callState.seconds++; const t = $('callTimer'); if (t) t.textContent = clock(callState.seconds) }, 1000)
 $('endCall').onclick = () => { clearInterval(callTimer); callState.minutes = Math.max(1, Math.round(callState.seconds / 60)); reflect() }
 $('cancelCall').onclick = () => { clearInterval(callTimer); closeCurtain() }
}
function reflect() {
 openCurtain('<span class="eyebrow">Just for you</span><h1 class="curtain-title">How did that feel?</h1>' +
  '<div class="chips" style="justify-content:center">' + Object.keys(FEELINGS).map(k =>
   '<button class="chip-choice" data-feel="' + k + '" aria-pressed="' + (callState.feeling === k) + '">' + FEELINGS[k].label + '</button>').join('') + '</div>' +
  '<p class="small" id="feelCaption">' + FEELINGS[callState.feeling].caption + '</p>' +
  '<div class="switch-row" style="width:100%"><b>About how long?</b><span style="display:flex;align-items:center;gap:10px">' +
   '<button class="cal-step" id="less" aria-label="Shorter">' + I.minus + '</button>' +
   '<span id="mins" style="font-family:var(--round);font-weight:700;min-width:78px;text-align:center">' + fmtDuration(callState.minutes) + '</span>' +
   '<button class="cal-step" id="more" aria-label="Longer">' + I.plus + '</button></span></div>' +
  '<div style="width:100%"><label class="label" for="aboutWhat">What was it about? (optional)</label>' +
  '<input class="input" id="aboutWhat" maxlength="90" placeholder="the tomatoes, mostly…" autocomplete="off"></div>' +
  '<button class="btn btn-block" id="toFlower">Choose a Flower</button>')
 curtainBody.querySelectorAll('[data-feel]').forEach(b => b.onclick = () => {
  callState.feeling = b.dataset.feel
  curtainBody.querySelectorAll('[data-feel]').forEach(x => x.setAttribute('aria-pressed', String(x === b)))
  $('feelCaption').textContent = FEELINGS[callState.feeling].caption
 })
 const step = () => callState.minutes >= 15 ? 5 : 1
 $('less').onclick = () => { callState.minutes = Math.max(1, callState.minutes - step()); $('mins').textContent = fmtDuration(callState.minutes) }
 $('more').onclick = () => { callState.minutes = Math.min(180, callState.minutes + step()); $('mins').textContent = fmtDuration(callState.minutes) }
 $('toFlower').onclick = () => { callState.topic = $('aboutWhat').value.trim(); pickFlower() }
}
function pickFlower() {
 callState.flower = FEELINGS[callState.feeling].flower
 openCurtain('<span class="eyebrow">' + esc(person(callState.id).name) + '&rsquo;s patch</span>' +
  '<h1 class="curtain-title">Which flower was it?</h1>' +
  '<p class="curtain-sub">Picked for a ' + FEELINGS[callState.feeling].label.toLowerCase() + ' call — or pick another.</p>' +
  '<div class="flower-grid">' + flowerLibrary.map(f =>
   '<button class="flower-option" role="radio" data-kind="' + f.id + '" aria-checked="' + (f.id === callState.flower) + '">' +
   flowerSVG(f.id, 40) + '<b>' + f.name + '</b><span>' + f.note + '</span></button>').join('') + '</div>' +
  '<button class="btn btn-block" id="plant">Plant It</button>')
 curtainBody.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => {
  callState.flower = b.dataset.kind
  curtainBody.querySelectorAll('[data-kind]').forEach(x => x.setAttribute('aria-checked', String(x === b)))
 })
 $('plant').onclick = plant
}
function plant() {
 const who = person(callState.id)
 const id = who.id + '-new-' + CALLS.length
 CALLS.push({ id, person: who.id, minutes: callState.minutes, at: new Date().toISOString(), flower: callState.flower, feeling: callState.feeling, topic: callState.topic || null })
 who.count++
 signature = ''
 S.fresh = id
 setTimeout(() => { S.fresh = null }, 6000)
 openCurtain('<span class="eyebrow">' + fmtDuration(callState.minutes) + ' together</span>' +
  '<div class="bloom-stage"><div style="animation:pop .8s cubic-bezier(.25,1.2,.35,1) both;transform-origin:50% 100%">' +
   flowerSVG(callState.flower, Math.round(110 * bloomScale(callState.minutes))) + '</div></div>' +
  '<h1 class="curtain-title">It opened.</h1>' +
  '<p class="curtain-sub">A longer call opens a fuller bloom. This one is planted in ' + esc(who.name) + '&rsquo;s patch, and it stays there.</p>' +
  '<button class="btn btn-block" id="toGarden">Back to Your Garden</button>')
 $('toGarden').onclick = () => { closeCurtain(); route('home'); setLift(0) }
}
const bloomScale = m => Math.min(1.5, Math.max(0.7, 0.6 + Math.sqrt(m) / 7))

function fireCue() {
 const who = PEOPLE[0]
 try { navigator.vibrate && navigator.vibrate([180, 110, 180, 110, 260]) } catch (e) { /* vibration blocked; the cue still shows */ }
 ringTone(3)
 openCurtain('<div style="display:flex;align-items:center;justify-content:space-between;width:100%;font-family:var(--round);font-size:13px;color:var(--ink-soft)"><span>harbor</span><span>now</span></div>' +
  '<span class="halo"><span class="avatar avatar-' + who.tone + ' avatar-xl">' + who.initials + '</span></span>' +
  '<p style="font-family:var(--round);font-weight:700;font-size:23px;color:var(--ink-deep)">' + esc(who.name) + '</p>' +
  '<h1 class="curtain-title">Looks like you&rsquo;re free.</h1>' +
  '<p class="curtain-sub">You just stopped walking — a good moment, if you want it.</p>' +
  '<div class="chips" style="justify-content:center">' + ['Catch up', 'Ask for help', 'Share news', 'Just because'].map(t =>
   '<button class="chip-choice" data-topic="' + t + '" aria-pressed="false">' + t + '</button>').join('') + '</div>' +
  '<div class="paths">' +
   '<button class="path" id="cueCall"><span class="path-icon">' + I.phone + '</span><b>Call now</b><span>~12 min, usually</span></button>' +
   '<button class="path" id="cueLove"><span class="path-icon">' + I.heart + '</span><b>Send a reaction</b><span>a photo, one line</span></button>' +
   '<button class="path" id="cueLater"><span class="path-icon">' + I.clock + '</span><b>Propose a later time</b><span>becomes today&rsquo;s next nudge</span></button></div>' +
  '<button class="btn btn-quiet" id="cueOut">not now</button>' +
  '<p class="note-strip">' + I.shield + 'Your walking stays on this phone. ' + esc(who.name) + ' never sees it.</p>')
 curtainBody.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
  const on = b.getAttribute('aria-pressed') === 'true'
  curtainBody.querySelectorAll('[data-topic]').forEach(x => x.setAttribute('aria-pressed', 'false'))
  b.setAttribute('aria-pressed', String(!on))
 })
 $('cueCall').onclick = () => startCall(who.id)
 $('cueLove').onclick = () => { closeCurtain(); toast('Sent. Nothing owed either way.') }
 $('cueLater').onclick = () => { closeCurtain(); toast('Saved. You will see it when the time comes.') }
 $('cueOut').onclick = () => { closeCurtain(); toast('Kept a little space for yourself.') }
}
function ringTone(times) {
 try {
  const actx = new (window.AudioContext || window.webkitAudioContext)()
  for (let i = 0; i < times; i++) {
   const at = actx.currentTime + i * 1.25
   const osc = actx.createOscillator(), gain = actx.createGain()
   osc.connect(gain); gain.connect(actx.destination); osc.type = 'sine'
   osc.frequency.setValueAtTime(660, at); osc.frequency.exponentialRampToValueAtTime(495, at + 0.5)
   gain.gain.setValueAtTime(0.0001, at); gain.gain.exponentialRampToValueAtTime(0.09, at + 0.04); gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.9)
   osc.start(at); osc.stop(at + 0.95)
  }
 } catch (e) { /* no audio here; the cue is still a cue */ }
}

/* ---------- today's question, once the app has settled ---------- */
const QUESTIONS = [
 { q: 'Tea, coffee, or neither today?', mom: 'Chai, obviously. Extra ginger today.', dad: 'Black coffee. The tomatoes needed watering early.' },
 { q: 'One good thing about today, however small?', mom: 'The jasmine finally opened.', dad: 'Found my old radio in the garage. Still works.' },
 { q: 'Early bird or night owl, honestly?', mom: 'Early bird. Mornings feel like mine.', dad: 'Night owl, but I pretend otherwise.' },
]
const TODAY_Q = QUESTIONS[new Date().getDate() % QUESTIONS.length]
function askQuestion() {
 openCurtain('<span class="eyebrow">Today&rsquo;s little question</span>' +
  '<h1 class="curtain-title">' + esc(TODAY_Q.q) + '</h1>' +
  '<p class="curtain-sub">No streak to keep — answer today, skip tomorrow, either is fine.</p>' +
  '<div style="width:100%"><textarea class="input" id="answer" maxlength="200" placeholder="Whatever comes to mind…"></textarea></div>' +
  '<button class="btn btn-block" id="shareAnswer">Share My Answer</button>' +
  '<button class="btn btn-quiet" id="skipQ">Not today</button>')
 $('shareAnswer').onclick = () => {
  const mine = $('answer').value.trim() || '…'
  openCurtain('<span class="eyebrow">Today&rsquo;s little question</span><h1 class="curtain-title">' + esc(TODAY_Q.q) + '</h1>' +
   '<div class="flow" style="width:100%">' +
   [['mom', TODAY_Q.mom], ['dad', TODAY_Q.dad]].map(([id, txt]) => {
    const p = person(id)
    return '<div class="row"><span class="avatar avatar-' + p.tone + ' avatar-sm">' + p.initials + '</span>' +
     '<span class="row-body"><b>' + p.name + '</b><span>' + esc(txt) + '</span></span></div>'
   }).join('') +
   '<div class="row" style="background:var(--tint-mint);box-shadow:none"><span class="avatar avatar-sky avatar-sm">Y</span>' +
   '<span class="row-body"><b>You</b><span>' + esc(mine) + '</span></span></div></div>' +
   '<button class="btn btn-block" id="doneQ">Back to Your Garden</button>')
  $('doneQ').onclick = closeCurtain
 }
 $('skipQ').onclick = closeCurtain
}

/* ---------- go ---------- */
$('scriptNote').textContent = greeting() + ', ' + S.name
route('home')
setTimeout(askQuestion, 1200)

})();
</script>
